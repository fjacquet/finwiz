site_name: FinWiz Documentation
site_description: AI-powered financial analysis platform with CrewAI
site_author: FinWiz Team
site_url: https://fjacquet.github.io/finwiz

repo_name: fjacquet/finwiz
repo_url: https://github.com/fjacquet/finwiz
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 FinWiz

# Theme configuration
theme:
  name: material
  language: en

  # Color scheme
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - navigation.instant # Instant loading
    - navigation.instant.prefetch # Prefetch pages
    - navigation.instant.progress # Progress indicator
    - navigation.tracking # Anchor tracking
    - navigation.tabs # Top-level navigation tabs
    - navigation.tabs.sticky # Sticky tabs
    - navigation.sections # Navigation sections
    - navigation.expand # Expand navigation by default
    - navigation.path # Show path in navigation
    - navigation.indexes # Section index pages
    - navigation.top # Back to top button
    - navigation.footer # Footer navigation
    - toc.follow # TOC follows scrolling
    - toc.integrate # Integrate TOC with navigation
    - search.suggest # Search suggestions
    - search.highlight # Highlight search results
    - search.share # Share search results
    - header.autohide # Auto-hide header
    - content.code.copy # Copy code button
    - content.code.annotate # Code annotations
    - content.tabs.link # Link content tabs
    - announce.dismiss # Dismissible announcements

  # Fonts
  font:
    text: Roboto
    code: Roboto Mono

  # Icon
  icon:
    repo: fontawesome/brands/github
    logo: material/chart-line
    annotation: material/arrow-right-circle

  # Favicon
  favicon: assets/favicon.ico

# Plugins
plugins:
  - search:
      lang: en
      separator: "[\\s\\-,:!=\\[\\]()\"/]+|(?!\\b)(?=[A-Z][a-z])|\\.(?!\\d)|&[lg]t;"
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer

  - awesome-pages:
      strict: false
      collapse_single_pages: false

  - mermaid2:
      version: 10.6.1
      arguments:
        theme: |
          ^(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'

  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true

# Markdown extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji ""
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom ""
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md

  - Getting Started:
      - User Guide: tutorials/USER_GUIDE.md
      - Developer Guide: development/DEVELOPER_GUIDE.md
      - Quick Reference: QUICK_REFERENCE.md
      - Requirements: REQUIREMENTS.md

  - Tutorials:
      - tutorials/index.md
      - Getting Started: tutorials/getting_started.md
      - First Analysis: tutorials/first_analysis.md
      - Portfolio Analysis: tutorials/portfolio_analysis.md

  - How-To Guides:
      - how-to/index.md
      - Setup Environment: how-to/setup_environment.md
      - Performance Optimization: how-to/PERFORMANCE_OPTIMIZATION_GUIDE.md
      - Memory Management: how-to/MEMORY_MANAGEMENT.md
      - Deep Analysis Troubleshooting: how-to/deep_analysis_troubleshooting.md
      - Batch Processing: how-to/BATCH_PROCESSING.md

  - Reference:
      - reference/index.md
      - API Reference: reference/API_REFERENCE.md
      - API:
          - API Overview: reference/api/index.md
      - Schemas:
          - Schema Overview: reference/schemas/index.md

  - Explanations:
      - explanations/index.md
      - Architecture Overview: explanations/ARCHITECTURE.md
      - Deep Analysis: explanations/deep_analysis.md
      - Design Principles: explanations/design_principles.md

  - Investment Discovery:
      - investment_discovery/index.md
      - User Guide: investment_discovery/investment_discovery_user_guide.md
      - API Reference: investment_discovery/investment_discovery_api_reference.md
      - Developer Guide: investment_discovery/investment_discovery_developer_guide.md
      - FAQ: investment_discovery/faq.md

  - Portfolio Rebalancing:
      - portfolio_rebalancing/index.md
      - User Guide: portfolio_rebalancing/user_guide.md
      - API Reference: portfolio_rebalancing/api_reference.md
      - Developer Guide: portfolio_rebalancing/developer_guide.md

  - Development:
      - Dependency Policy: development/dependencies.md

# Extra CSS/JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Extra
extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fjacquet/finwiz
      name: FinWiz on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/finwiz/
      name: FinWiz on PyPI

  version:
    provider: mike
    default: latest

  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

# Validation
validation:
  nav:
    omitted_files: info # Downgrade to info for pages not in nav
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: info # Downgrade to info for minor link issues
