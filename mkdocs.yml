site_name: FinWiz Documentation
site_description: AI-powered financial analysis platform with CrewAI
site_author: FinWiz Team
site_url: https://fjacquet.github.io/finwiz

repo_name: fjacquet/finwiz
repo_url: https://github.com/fjacquet/finwiz
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 FinWiz

# Theme configuration
theme:
  name: material
  language: en

  # Color scheme
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - navigation.instant # Instant loading
    - navigation.instant.prefetch # Prefetch pages
    - navigation.instant.progress # Progress indicator
    - navigation.tracking # Anchor tracking
    - navigation.tabs # Top-level navigation tabs
    - navigation.tabs.sticky # Sticky tabs
    - navigation.sections # Navigation sections
    - navigation.expand # Expand navigation by default
    - navigation.path # Show path in navigation
    - navigation.indexes # Section index pages
    - navigation.top # Back to top button
    - navigation.footer # Footer navigation
    - toc.follow # TOC follows scrolling
    - toc.integrate # Integrate TOC with navigation
    - search.suggest # Search suggestions
    - search.highlight # Highlight search results
    - search.share # Share search results
    - header.autohide # Auto-hide header
    - content.code.copy # Copy code button
    - content.code.annotate # Code annotations
    - content.tabs.link # Link content tabs
    - announce.dismiss # Dismissible announcements

  # Fonts
  font:
    text: Roboto
    code: Roboto Mono

  # Icon
  icon:
    repo: fontawesome/brands/github
    logo: material/chart-line
    annotation: material/arrow-right-circle

  # Favicon
  favicon: assets/favicon.ico

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer

  - awesome-pages:
      strict: false
      collapse_single_pages: false

  - mermaid2:
      version: 10.6.1
      arguments:
        theme: |
          ^(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'

  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true

# Markdown extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

