# FinWiz Documentation - GitHub Pages Configuration

# Site Settings
title: FinWiz Documentation
description: AI-powered financial analysis platform with CrewAI
baseurl: "" # Leave empty for root deployment
url: "https://fjacquet.github.io/finwiz" # Update with your actual GitHub Pages URL

# Repository
repository: fjacquet/finwiz

# Theme - Using Just the Docs for better documentation experience
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

# Just the Docs Configuration
color_scheme: finwiz # Custom FinWiz color scheme

# Logo
logo: "/assets/images/logo.png"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

# Navigation structure
nav_sort: case_insensitive

# Footer content
footer_content: "Copyright &copy; 2025 FinWiz. AI-powered financial analysis platform."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Aux links for the upper right navigation
aux_links:
  "FinWiz on GitHub":
    - "//github.com/fjacquet/finwiz"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Heading anchor links
heading_anchors: true

# Enable copy button on code blocks
enable_copy_code_button: true

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from processing
exclude:
  - .venv/
  - .kiro/
  - .taskmaster/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README_INTERNAL.md
  - mkdocs.yml
  - site/
  - analysis/
  - output/
  - input/
  - logs/
  - archive/

# Collections
collections:
  tutorials:
    output: true
    permalink: /tutorials/:name/
  how-to:
    output: true
    permalink: /how-to/:name/
  reference:
    output: true
    permalink: /reference/:name/
  explanations:
    output: true
    permalink: /explanations/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "tutorials"
    values:
      layout: "default"
      category: "tutorial"
  - scope:
      path: ""
      type: "how-to"
    values:
      layout: "default"
      category: "how-to"
  - scope:
      path: ""
      type: "reference"
    values:
      layout: "default"
      category: "reference"
  - scope:
      path: ""
      type: "explanations"
    values:
      layout: "default"
      category: "explanation"

# Navigation
header_pages:
  - index.md
  - tutorials/getting_started.md
  - how-to/setup_environment.md
  - reference/API_REFERENCE.md
  - explanations/ARCHITECTURE.md
