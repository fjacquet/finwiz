<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rapport FinWiz{% endblock %}</title>
    <style>
        /* Base Styles with Light/Dark Mode Support */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #34495e;
            --text-muted: #666;
            --border-color: #ddd;
            --accent: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --bg-card: #2d2d2d;
                --text-primary: #ecf0f1;
                --text-secondary: #bdc3c7;
                --text-muted: #95a5a6;
                --border-color: #444;
                --accent: #3498db;
                --success: #2ecc71;
                --warning: #f39c12;
                --danger: #e74c3c;
                --shadow: rgba(0, 0, 0, 0.3);
            }
        }

        /* Reset and Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-secondary);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--bg-primary);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px var(--shadow);
        }

        /* Typography */
        h1 {
            color: var(--text-primary);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 0.5rem;
        }

        h2 {
            color: var(--text-secondary);
            font-size: 1.8rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        h3 {
            color: var(--text-secondary);
            font-size: 1.4rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        h4 {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        p {
            margin-bottom: 1rem;
        }

        /* Grade Color Classes */
        .grade-a-plus {
            color: var(--success);
            font-weight: bold;
        }

        .grade-a {
            color: #2ecc71;
        }

        .grade-b {
            color: var(--warning);
        }

        .grade-c {
            color: #e67e22;
        }

        .grade-d {
            color: var(--danger);
        }

        .grade-f {
            color: #c0392b;
            font-weight: bold;
        }

        /* Recommendation Styles */
        .recommendation {
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            background-color: var(--bg-card);
            border-left: 4px solid var(--accent);
        }

        .recommendation.buy {
            border-left-color: var(--success);
            background-color: rgba(39, 174, 96, 0.1);
        }

        .recommendation.sell {
            border-left-color: var(--danger);
            background-color: rgba(231, 76, 60, 0.1);
        }

        .recommendation.hold {
            border-left-color: var(--warning);
            background-color: rgba(243, 156, 18, 0.1);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0;
        }

        .metric-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            border-left: 4px solid var(--accent);
            box-shadow: 0 2px 5px var(--shadow);
        }

        .metric-card h4 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            margin-top: 0;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: var(--accent);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover {
            background-color: var(--bg-secondary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Sections */
        .section {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 5px var(--shadow);
        }

        /* Lists */
        ul {
            margin: 1rem 0;
            padding-left: 2rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        /* Risk Assessment */
        .risk-assessment {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            background-color: var(--bg-secondary);
        }

        .risk-low {
            color: var(--success);
        }

        .risk-medium {
            color: var(--warning);
        }

        .risk-high {
            color: var(--danger);
        }

        /* Data Sources */
        .data-sources {
            margin-top: 2rem;
            padding: 1rem;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .data-sources h3 {
            margin-top: 0;
        }

        .data-sources ul {
            list-style-type: none;
            padding-left: 0;
        }

        .data-sources li {
            padding: 0.25rem 0;
        }

        /* Footer */
        .footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 8px;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                padding: 20px;
            }

            .section {
                box-shadow: none;
                border: 1px solid #ddd;
            }

            @page {
                margin: 2cm;
            }
        }

        /* Utility Classes */
        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .font-bold {
            font-weight: bold;
        }

        .mb-1 {
            margin-bottom: 1rem;
        }

        .mb-2 {
            margin-bottom: 2rem;
        }

        .mt-1 {
            margin-top: 1rem;
        }

        .mt-2 {
            margin-top: 2rem;
        }

        /* Animation */
        .section {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Status Indicators */
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-green {
            background-color: var(--success);
        }

        .status-yellow {
            background-color: var(--warning);
        }

        .status-red {
            background-color: var(--danger);
        }

        /* Report Link Buttons */
        .report-link {
            margin-top: 1rem;
            text-align: right;
        }

        .btn-view-report {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px var(--shadow);
        }

        .btn-view-report:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px var(--shadow);
        }

        .btn-view-report-small {
            display: inline-block;
            padding: 6px 12px;
            margin: 4px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .btn-view-report-small:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .report-links-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .cost-free {
            color: var(--success);
        }

        /* Additional Content Styles */
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}

        <div class="footer">
            <p><strong>Rapport généré par FinWiz</strong></p>
            <p>Ce rapport est fourni à titre informatif uniquement et ne constitue pas un conseil en investissement.</p>
            <p><em>Généré le {{ generation_date }}</em></p>
        </div>
    </div>
</body>
</html>
