<!-- FinWiz Unified Design Tokens — shared across all report templates -->
<style>
    /* ================================================================
       DESIGN TOKENS — Single source of truth for the FinWiz design system.
       Both base_template.html and crew_reports/base.html include this file.
       ================================================================ */

    :root {
        /* Background */
        --bg-primary: #ffffff;
        --bg-secondary: #f8f9fa;
        --bg-tertiary: #e9ecef;
        --bg-card: #ffffff;

        /* Text */
        --text-primary: #212529;
        --text-secondary: #6c757d;
        --text-muted: #adb5bd;

        /* Borders & Shadows */
        --border-color: #dee2e6;
        --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        --shadow-md: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        --shadow-lg: 0 1rem 3rem rgba(0, 0, 0, 0.175);
        --shadow: rgba(0, 0, 0, 0.1);

        /* Accent & Status Colors (Bootstrap palette) */
        --accent: #0d6efd;
        --accent-secondary: #6f42c1;
        --success: #198754;
        --warning: #fd7e14;
        --danger: #dc3545;
        --info: #0dcaf0;

        /* Aliases for backwards compatibility */
        --accent-primary: var(--accent);
        --success-color: var(--success);
        --warning-color: var(--warning);
        --danger-color: var(--danger);
        --info-color: var(--info);

        /* Layout */
        --border-radius: 0.375rem;
        --border-radius-lg: 0.5rem;
        --transition: all 0.15s ease-in-out;
    }

    /* Dark Theme — explicit toggle via JS (data-theme="dark") */
    [data-theme="dark"] {
        --bg-primary: #212529;
        --bg-secondary: #343a40;
        --bg-tertiary: #495057;
        --bg-card: #343a40;
        --text-primary: #f8f9fa;
        --text-secondary: #adb5bd;
        --text-muted: #6c757d;
        --border-color: #495057;
        --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.3);
        --shadow-md: 0 0.5rem 1rem rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 1rem 3rem rgba(0, 0, 0, 0.5);
        --shadow: rgba(0, 0, 0, 0.3);
    }

    /* Dark Theme — OS preference fallback (only when no explicit data-theme is set) */
    @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]):not([data-theme="dark"]) :root,
        body:not([data-theme="light"]):not([data-theme="dark"]) {
            --bg-primary: #212529;
            --bg-secondary: #343a40;
            --bg-tertiary: #495057;
            --bg-card: #343a40;
            --text-primary: #f8f9fa;
            --text-secondary: #adb5bd;
            --text-muted: #6c757d;
            --border-color: #495057;
            --shadow: rgba(0, 0, 0, 0.3);
        }
    }

    /* Unified Font Stack */
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
</style>
