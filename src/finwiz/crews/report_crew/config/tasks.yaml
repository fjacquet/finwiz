# Task 1: Comprehensive Financial Integration and Opportunity Identification
comprehensive_financial_integration_task:
  description: |
    Review and synthesize investment recommendations from the Stock, ETF, and Crypto crew reports
    (located in their respective output directories, e.g., ../crypto_crew/output/crypto_report.md).
    Extract key data, analyze integrated opportunities, and produce a consolidated analysis.
    Focus on identifying the strongest, evidence-based opportunities suitable for a family
    with a 1000 CHF monthly investment budget and medium to long-term goals (5-15 years).

    Key Steps:
    1. Access and thoroughly review the latest reports (generated around {full_date}) from the Stock, ETF, and Crypto crews.
    2. Extract specific, actionable investment recommendations (e.g., stock tickers, ETF names, crypto projects).
    3. Identify overlapping recommendations or complementary strategies across asset classes, considering the market context as of {full_date}.
    4. Evaluate the rationale and evidence provided for each recommendation.
    5. Prioritize opportunities based on potential returns, risk profile, and alignment with family goals, reflecting current conditions as of {full_date}.
    6. Ensure all analysis considers the 1000 CHF monthly budget constraint.
    7. Locate validated ticker appendices in upstream crew outputs and extract them:
       - Stocks: validated_tickers[]
       - ETFs: validated_etfs[]
       - Crypto: validated_symbols[]
    8. Cross-check narrative recommendations against these arrays. Flag any symbols mentioned in the reports but missing from the validated arrays and summarize required upstream validation actions.
    9. Produce a concise, machine-readable summary block for the reporter to embed (e.g., missing_validated_etfs, missing_validated_stocks, crypto_notes) without performing any new external validation.

    OUTPUT: A comprehensive document detailing integrated insights, key data points from all asset classes,
    and a prioritized list of investment opportunities with justifications, all relevant as of {full_date}.
  expected_output: >
    A structured analytical document that consolidates findings from all specialized crews.
    It should highlight the most promising investment opportunities across stocks, ETFs, and crypto,
    providing clear rationale and how they fit within a 1000 CHF monthly budget.
    The document must include verifiable data and references to the source reports.
  agent: financial_integration_analyst
  output_file: "output/report/consolidated_financial_analysis.md"

# Task 2: Optimal Portfolio Allocation
optimal_portfolio_allocation_task:
  description: |
    Based on the 'comprehensive_financial_integration_task' output, develop an optimal, diversified
    portfolio allocation strategy for a family with a 1000 CHF monthly investment budget.
    The family profile is a 50-year-old father with medium-term (5-10 years) and long-term (10-15 years)
    financial goals.

    Key Steps:
    1. Review the consolidated analysis (current as of {full_date}) and prioritized opportunities.
    2. Determine appropriate asset class weightings (stocks, ETFs, crypto) based on risk tolerance and goals, considering the market outlook as of {full_date}.
    3. Select specific investments from the prioritized list for inclusion in the portfolio.
    4. Allocate the 1000 CHF monthly budget across the selected investments, specifying exact CHF amounts.
    5. Justify each allocation choice, explaining how it contributes to the overall strategy and family goals, based on information available up to {full_date}.
    6. Ensure the portfolio is diversified and balances growth potential with capital preservation.

    OUTPUT: A detailed portfolio allocation plan, reflecting market conditions as of {full_date}.
  expected_output: >
    A specific and actionable portfolio allocation plan detailing the distribution of the 1000 CHF
    monthly investment across selected stocks, ETFs, and cryptocurrencies. The plan must include
    exact CHF amounts for each investment, percentage allocations, and a clear justification
    for the overall strategy and individual choices, tailored to the family's profile and goals.
  agent: portfolio_allocator
  output_file: "output/report/optimal_portfolio_allocation.md"

# Task 3: Risk Assessment and Mitigation Strategy
risk_assessment_mitigation_task:
  description: |
    Conduct a thorough risk assessment of the proposed portfolio from the 'optimal_portfolio_allocation_task'.
    Develop practical mitigation strategies for identified risks, considering the family's profile
    (50-year-old father, medium to long-term goals).

    Key Steps:
    1. Analyze the allocated portfolio for specific investment risks (market, credit, liquidity, etc.) based on data as of {full_date}.
    2. Evaluate portfolio-level risks (concentration, correlation, asset class specific) considering current market volatilities as of {full_date}.
    3. Assess how macroeconomic factors, current as of {full_date}, could impact the portfolio.
    4. Identify risks specific to the family's financial situation and time horizon.
    5. Develop actionable mitigation strategies for each significant risk (e.g., diversification adjustments,
       hedging considerations, stop-loss orders, alternative investments).
    6. Recommend specific actions to manage and monitor risks effectively, with all analysis current as of {full_date}.

    OUTPUT: A comprehensive risk assessment report with actionable mitigation strategies, pertinent to {full_date}.
  expected_output: >
    A detailed report identifying key risks in the allocated portfolio (both individual asset and
    portfolio-level). The report must provide practical, actionable strategies to mitigate these risks,
    appropriate for the family's profile and investment horizon.
  agent: risk_manager
  output_file: "output/report/risk_assessment_and_mitigation.md"

# Task 4: Comprehensive Investment Report and Implementation Plan
comprehensive_investment_report_task:
  description: |
    Compile all findings from previous tasks (Consolidated Analysis, Portfolio Allocation, Risk Assessment)
    into a final, comprehensive investment report. This report should reflect the financial landscape as of {full_date}.
    Generate a visually appealing HTML final report that combines all previous analyses into a single,
    easy-to-understand financial plan, dated {full_date}.
    Follow the report guidelines document at docs/output_formatting_guide.md.
    The report must be in French.

    Structure the report with these engaging sections (incluez des sous-sections "Synthèse 10-K" et "Sentiment du Marché" basées uniquement sur les contenus amont, avec citations SEC, dates et sources) :

    🏠 1. Synthèse et Aperçu Familial
       - Recommandations clés en un coup d'œil
       - Répartition globale de l'investissement
       - Indicateurs de performance attendus

    🎯 2. Objectifs Financiers Familiaux et Calendrier (1/3/5/10 Ans)
       - Objectifs à court terme (1-2 ans) 🚀
       - Objectifs à moyen terme (3-5 ans) 📈
       - Constitution de patrimoine à long terme (5-10+ ans) 🌟

    💎 3. Recommandations d'Investissement
      - Sélection d'actions 📊
      - Sélection d'ETFs 📈
      - Allocation en cryptomonnaies (le cas échéant) ₿
      - Niveau de risque pour chaque recommandation ⚠️
      - Synthèse 10-K (citations SEC, date de dépôt, sections clés: Business Overview, MD&A, Risk Factors, Liquidité, Segments) 📄

    💰 4. Allocation de Portefeuille
       - Répartition par classe d'actifs 📊
       - Diversification sectorielle 🌐
       - Exposition géographique 🌍
       - Mix de styles d'investissement (Croissance/Valeur/Mixte) 📊

    🛡️ 5. Évaluation et Gestion des Risques
      - Niveau de risque global du portefeuille ⚠️
      - Facteurs de risque par classe d'actifs 🔍
      - Stratégies d'atténuation 🛡️
      - Scénarios de stress tests 🌪️
      - Sentiment du Marché (score moyen, répartition Pos/Neutre/Neg, top 3 titres positifs/négatifs avec URL et date) 📰

    📦 Revue du portefeuille: Conserver ou Vendre (section spéciale)
      - Utilisez exclusivement le contexte JSON injecté `portfolio_review` (inputs.portfolio_review). Aucun outil ni appel externe.
      - Pour chaque ligne détenue: affichez Nom, Ticker, Décision (KEEP/SELL), Score composite, et Risque (score et niveau).
      - Si la décision est SELL, proposez jusqu'à 3 alternatives issues du JSON avec score et risque, avec puces synthétiques.
      - Affichez un tableau récapitulatif (Nom | Ticker | Décision | Score | Risque) et une courte analyse globale.
      - Contexte JSON injecté (ne pas appeler d'outils; utilisez le contenu ci‑dessous tel quel) :
        ```json
        {portfolio_review}
        ```

    🏦 6. Guide de Mise en Œuvre
       - Instructions d'investissement étape par étape 📝
       - Courtiers/plateformes recommandés 💻
       - Considérations fiscales 💰
       - Types de comptes à utiliser (Imposable/Retraite) 🏦

    🔄 7. Suivi et Maintenance
       - Calendrier de révision (Mensuel/Trimestriel/Annuel) 📅
       - Stratégie de rééquilibrage ⚖️
       - Indicateurs de performance clés 📊
       - Quand ajuster la stratégie 🔄

    💡 8. Ressources Additionnelles
       - Glossaire des termes 📚
       - Liste de lectures recommandées 📖
        - Contacts importants 📞
    
    📎 Annexes & Prochaines étapes
       - Corrections et Suggestions — Validation des Tickers
         (construites à partir des annexes JSON validées amont: validated_tickers[],
         validated_etfs[], validated_symbols[]; le reporter ne fait aucune validation externe).
       - Inclure un petit bloc JSON machine‑lisible récapitulatif (ex.: missing_validated_etfs,
         missing_validated_stocks, crypto_notes) directement dérivé des données amont.

    Utilisez généreusement les emojis, icônes et éléments visuels pour améliorer la lisibilité.
    Incluez des en-têtes de section clairs, des listes à puces et des tableaux le cas échéant.
    Assurez-vous que le rapport est adapté aux mobiles et s'imprime bien.
  expected_output: |
    Un rapport HTML magnifiquement formaté et riche en emojis qui présente le plan financier
    de la famille de manière engageante et facile à comprendre. Le rapport doit être
    visuellement attrayant avec des en-têtes de section clairs, un style cohérent et une
    mise en page professionnelle qui rend les informations financières complexes accessibles
    à tous les membres de la famille.
    Le rapport doit être en français.
    Inclure une annexe "Corrections et Suggestions — Validation des Tickers" fondée exclusivement
    sur les annexes JSON validées des équipes (validated_tickers[], validated_etfs[], validated_symbols[]),
    ainsi qu'un court bloc JSON récapitulatif. Aucun appel externe supplémentaire ne doit être effectué.
  agent: investment_reporter
  output_file: "output/finwiz_family_financial_plan.html"

# Task 5: PDF Generation from HTML Report
pdf_generation_task:
  description: |
    Convert the final HTML financial report (generated by the 'comprehensive_investment_report_task')
    into a PDF document. The input to this task will be the file path of the HTML report.
    Ensure the PDF is saved in the same directory as the HTML report.
  expected_output: >
    A confirmation message indicating the successful conversion of the HTML report to PDF,
    including the path to the saved PDF file. Or an error message if conversion failed.
  agent: pdf_conversion_specialist
  # This task will implicitly use the output_file from the 'comprehensive_investment_report_task'
  # as its input context if it's the next task in a sequence.
  # The HtmlToPdfTool is designed to take the HTML file path as its direct argument.
  # No separate output_file is needed here as the tool handles PDF saving.

translation_task:
  description: >
    Translate the comprehensive English investment report to French
    while preserving the exact HTML structure, CSS styling, emojis, and formatting.
    Maintain all technical financial terminology accuracy and professional tone.
    Do not modify the HTML structure, CSS classes, or visual elements - only translate
    the text content within HTML tags.
  expected_output: >
    A complete French translation of the investment report with
    identical HTML structure, formatting, and visual elements. All financial
    terminology should be accurately translated while maintaining professional
    investment report standards.
  agent: translator
  output_file: "output/finwiz_family_financial_plan_fr.html"
