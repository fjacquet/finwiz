# Task 1: Comprehensive Financial Integration and Opportunity Identification
comprehensive_financial_integration_task:
  description: |
    ⚠️ CRITICAL ANTI-HALLUCINATION RULES - READ FIRST ⚠️
    
    1. You MUST ONLY use ticker symbols from inputs.validated_tickers_list[]
    2. DO NOT invent, create, or hallucinate ANY ticker symbols under any circumstances
    3. DO NOT create fake company names, SEC filings, or URLs
    4. DO NOT use example tickers like ABC, XYZ, LMN, TEST, SAMPLE, EXAMPLE
    5. Every ticker you mention MUST exist in inputs.validated_tickers_list[]
    6. If you cannot find a ticker in validated_tickers_list, DO NOT mention it
    7. If validated_tickers_list has fewer than 3 tickers, acknowledge the limitation
    
    VERIFIED DATA SOURCES (use ONLY these):
    - inputs.validated_tickers_list[] - The ONLY tickers you are allowed to use
    - inputs.stock_analysis_data - Analysis for tickers in validated_tickers_list
    - inputs.etf_analysis_data - ETF analysis for validated tickers
    - inputs.crypto_analysis_data - Crypto analysis for validated symbols
    
    FORBIDDEN ACTIONS (will cause task failure):
    - Creating placeholder or example tickers (ABC, XYZ, etc.)
    - Inventing company names like "Alpha Beta Corp", "Lumina Networks", "Xylon Holdings"
    - Fabricating SEC filing URLs or CIK numbers
    - Using any ticker not explicitly listed in validated_tickers_list
    - Making up data when real data is unavailable
    
    If you find yourself wanting to create an example ticker or company name,
    STOP immediately and work only with the validated tickers provided.
    
    ---
    
    Review and synthesize investment recommendations using the integrated data system.
    Access consolidated data from Stock, ETF, Crypto, and Discovery crews through the 
    integrated data context. Extract key data, analyze integrated opportunities, and 
    produce a consolidated analysis with proper SEC/EDGAR citations and market sentiment.

    Key Steps:
    1. Access integrated data context containing consolidated crew outputs with metadata and freshness status.
    2. FIRST: Review inputs.validated_tickers_list[] - these are the ONLY tickers you may use.
    3. Review SEC/EDGAR citations with filing dates and excerpts from stock analysis (ONLY for validated tickers).
    4. Analyze market sentiment data with aggregated scores and top 3 sources with URLs and dates.
    5. Use ONLY ticker symbols from inputs.validated_tickers_list[] - verify each ticker before mentioning it.
    6. Review A+ opportunities from discovery crew with allocation recommendations and replacement notes.
    7. Identify overlapping recommendations or complementary strategies across asset classes.
    8. Evaluate the rationale and evidence provided for each recommendation, including A+ discovery insights.
    9. Prioritize opportunities based on potential returns, risk profile, and alignment with family goals.
    10. Ensure all analysis considers the 1000 CHF monthly budget constraint.
    11. Handle graceful degradation for missing or stale data with clear warnings.
    12. Include data availability status and freshness warnings in the analysis.
    13. Produce a comprehensive analysis with proper source attribution and data lineage.
    14. FINAL CHECK: Verify every ticker mentioned is in inputs.validated_tickers_list[].

    Data Sources (accessed through integrated context):
    - Stock crew data: 10-K insights, validated tickers, SEC citations, market sentiments
    - ETF crew data: validated ETFs, factsheets, holdings analysis, risk assessments  
    - Crypto crew data: validated symbols, crypto theses, market analysis
    - Discovery crew data: A+ opportunities, portfolio improvements, optimization results
    - Consolidated market sentiment: aggregated scores, top sources with attribution
    - Consolidated ticker validation: validation status, alternatives for failed validations

    OUTPUT: A comprehensive document with integrated insights, SEC/EDGAR citations, 
    market sentiment analysis, and prioritized investment opportunities.
  expected_output: >
    A structured analytical document that consolidates findings from all specialized crews
    using the integrated data system. CRITICAL: Every ticker symbol mentioned must be from
    inputs.validated_tickers_list[] - NO exceptions. The document should include SEC/EDGAR 
    citations with filing dates (ONLY for validated tickers), market sentiment analysis with 
    source attribution, A+ opportunities with allocation recommendations, and clear handling 
    of missing or stale data. The document must include verifiable data and references with 
    proper data lineage. DO NOT include any ticker symbols not in validated_tickers_list[].
  agent: financial_integration_analyst
  output_file: "output/report/consolidated_financial_analysis.md"
  async_execution: true

# Task 2: Optimal Portfolio Allocation
optimal_portfolio_allocation_task:
  description: |
    ⚠️ CRITICAL: Use ONLY tickers from inputs.validated_tickers_list[] ⚠️
    DO NOT invent or hallucinate ticker symbols. Every ticker must be validated.
    
    Based on the integrated data analysis, develop an optimal, diversified portfolio allocation 
    strategy incorporating A+ opportunities and validated ticker symbols. Use consolidated data
    to ensure all recommendations are properly validated and include allocation updates based
    on A+ discoveries.

    Key Steps:
    1. Review the consolidated analysis with integrated data and A+ opportunities.
    2. Incorporate A+ opportunity allocation recommendations and replacement notes.
    3. Use validated ticker symbols from consolidated ticker validation results.
    4. Determine appropriate asset class weightings (stocks, ETFs, crypto) based on integrated risk assessments.
    5. Select specific investments from validated opportunities, prioritizing A+ discoveries.
    6. Allocate the 1000 CHF monthly budget across validated investments, specifying exact CHF amounts.
    7. Include portfolio allocation updates based on A+ opportunity recommendations.
    8. Handle graceful degradation if A+ opportunities are unavailable.
    9. Justify each allocation choice with reference to integrated data sources.
    10. Ensure the portfolio is diversified and balances growth potential with capital preservation.

    Data Integration Features:
    - Use A+ opportunity allocation recommendations to optimize portfolio quality
    - Include replacement notes for improving existing positions
    - Reference validated ticker symbols to ensure accuracy
    - Incorporate consolidated risk assessments from all crews
    - Handle missing data gracefully with alternative recommendations

    OUTPUT: A detailed portfolio allocation plan with A+ opportunity integration.
  expected_output: >
    A specific and actionable portfolio allocation plan incorporating A+ opportunities and
    validated ticker symbols. The plan must include exact CHF amounts for each investment,
    percentage allocations, A+ opportunity integration, replacement recommendations,
    and clear justification for choices based on integrated data sources.
  agent: portfolio_allocator
  output_file: "output/report/optimal_portfolio_allocation.md"
  async_execution: true
  depends_on:
    - comprehensive_financial_integration_task

# Task 3: Risk Assessment and Mitigation Strategy
risk_assessment_mitigation_task:
  description: |
    ⚠️ CRITICAL: Use ONLY tickers from inputs.validated_tickers_list[] ⚠️
    DO NOT invent or hallucinate ticker symbols. Every ticker must be validated.
    
    Conduct a thorough risk assessment using consolidated risk data from all crews.
    Incorporate market sentiment analysis and A+ opportunity risk profiles to develop
    comprehensive mitigation strategies.

    Key Steps:
    1. Analyze consolidated risk assessments from stock, ETF, and crypto crews.
    2. Incorporate market sentiment analysis to assess sentiment-based risks.
    3. Evaluate A+ opportunity risk profiles and their impact on portfolio risk.
    4. Assess portfolio-level risks using integrated data from all asset classes.
    5. Identify risks specific to validated ticker symbols and their validation status.
    6. Analyze data freshness risks and their impact on decision quality.
    7. Develop actionable mitigation strategies for each significant risk category.
    8. Include sentiment-based risk monitoring using top sentiment sources.
    9. Recommend specific actions based on integrated risk data.
    10. Handle graceful degradation for missing risk data with conservative assumptions.

    Integrated Risk Data Sources:
    - Consolidated risk assessments from all crews with standardized risk scores
    - Market sentiment analysis with positive/neutral/negative distribution
    - A+ opportunity risk profiles and confidence scores
    - Ticker validation status and alternative suggestions for failed validations
    - Data freshness status and staleness warnings
    - Cross-crew risk correlation analysis

    OUTPUT: A comprehensive risk assessment with integrated data and sentiment analysis.
  expected_output: >
    A detailed report identifying key risks using consolidated data from all crews.
    The report must include market sentiment-based risks, A+ opportunity risk analysis,
    ticker validation risks, data freshness risks, and practical mitigation strategies
    with reference to integrated data sources and sentiment analysis.
  agent: risk_manager
  output_file: "output/report/risk_assessment_and_mitigation.md"
  async_execution: true
  depends_on:
    - optimal_portfolio_allocation_task

# Task 4: Comprehensive Investment Report and Implementation Plan
comprehensive_investment_report_task:
  description: |
    ⚠️ CRITICAL ANTI-HALLUCINATION RULES ⚠️
    
    1. You MUST ONLY use ticker symbols from inputs.validated_tickers_list[]
    2. DO NOT invent ticker symbols like ABC, XYZ, LMN, TEST, SAMPLE
    3. DO NOT create fake company names like "Alpha Beta Corp", "Lumina Networks", "Xylon Holdings"
    4. DO NOT fabricate SEC filing URLs or CIK numbers
    5. Every ticker in the HTML report MUST be from validated_tickers_list[]
    6. If a ticker is not in validated_tickers_list[], DO NOT include it in the report
    
    Read the consolidated analysis from previous tasks, but VERIFY every ticker against
    inputs.validated_tickers_list[] before including it in the HTML report.
    
    ---
    
    Compile all findings using the integrated data system to create a comprehensive investment report
    with SEC/EDGAR citations, market sentiment analysis, A+ opportunities, and validated ticker symbols.
    Generate a visually appealing HTML report that leverages all integrated data sources.
    Follow the report guidelines document at docs/output_formatting_guide.md.
    The report must be in French.

    Integrated Data Usage:
    - Use SEC/EDGAR citations with filing URLs, dates, and excerpts from integrated stock data
    - Include market sentiment analysis with aggregated scores and top 3 sources with attribution
    - Incorporate A+ opportunities with allocation recommendations and replacement notes
    - Reference validated ticker symbols with validation status and alternatives
    - Include data availability status and freshness warnings
    - Handle graceful degradation for missing or stale data

    Structure the report with these engaging sections (incluez des sous-sections "Synthèse 10-K" et "Sentiment du Marché" basées uniquement sur les contenus amont, avec citations SEC, dates et sources) :

    🏠 1. Synthèse et Aperçu Familial
       - Recommandations clés en un coup d'œil
       - Répartition globale de l'investissement
       - Indicateurs de performance attendus

    🎯 2. Objectifs Financiers Familiaux et Calendrier (1/3/5/10 Ans)
       - Objectifs à court terme (1-2 ans) 🚀
       - Objectifs à moyen terme (3-5 ans) 📈
       - Constitution de patrimoine à long terme (5-10+ ans) 🌟

    💎 3. Recommandations d'Investissement
      - Sélection d'actions 📊 (UNIQUEMENT tickers de inputs.validated_tickers_list[])
      - Sélection d'ETFs 📈 (UNIQUEMENT ETFs de inputs.validated_tickers_list[])
      - Allocation en cryptomonnaies ₿ (UNIQUEMENT symboles de inputs.validated_tickers_list[])
      - Niveau de risque pour chaque recommandation ⚠️
      - Synthèse 10-K 📄 (UNIQUEMENT pour tickers dans validated_tickers_list[] - citations SEC avec URLs réelles, dates de dépôt vérifiées, et extraits des sections: Business Overview, MD&A, Risk Factors, Liquidité, Segments)

    ⭐ 3.1. Opportunités A+ Découvertes (du système d'intégration)
      - Utilisez les données A+ du contexte intégré `aplus_opportunities` si disponible
      - ETF A+ recommandés avec notes d'allocation et de remplacement
      - Actions A+ recommandées avec recommandations d'allocation
      - Crypto A+ recommandés avec analyse de confiance
      - Score de confiance global des opportunités A+
      - Recommandations de remplacement pour améliorer les positions existantes
      - Nouvelles opportunités d'investissement A+ à considérer
      - Impact sur la diversification et le profil de risque
      - Horodatage de validation des opportunités A+

    💰 4. Allocation de Portefeuille
       - Répartition par classe d'actifs 📊
       - Diversification sectorielle 🌐
       - Exposition géographique 🌍
       - Mix de styles d'investissement (Croissance/Valeur/Mixte) 📊

    🛡️ 5. Évaluation et Gestion des Risques
      - Niveau de risque global du portefeuille ⚠️ (consolidé de tous les crews)
      - Facteurs de risque par classe d'actifs 🔍 (avec évaluations standardisées)
      - Stratégies d'atténuation 🛡️ (basées sur l'analyse intégrée)
      - Scénarios de stress tests 🌪️
      - Sentiment du Marché (du système d'intégration) 📰:
        * Scores agrégés: Positif/Neutre/Négatif avec pourcentages
        * Top 3 sources de sentiment avec URLs, dates de publication et scores de confiance
        * Qualité des données de sentiment (HIGH/MEDIUM/LOW)
        * Analyse par crew (stock, crypto) avec nombre de sources

    📦 Revue du portefeuille: Conserver ou Vendre (section spéciale)
      - Utilisez exclusivement le contexte JSON injecté `portfolio_review` (inputs.portfolio_review). Aucun outil ni appel externe.
      - Pour chaque ligne détenue: affichez Nom, Ticker, Décision (KEEP/SELL), Score composite, et Risque (score et niveau).
      - Si la décision est SELL, proposez jusqu'à 3 alternatives issues du JSON avec score et risque, avec puces synthétiques.
      - Affichez un tableau récapitulatif (Nom | Ticker | Décision | Score | Risque) et une courte analyse globale.
      - Contexte JSON injecté (ne pas appeler d'outils; utilisez le contenu ci‑dessous tel quel) :
        ```json
        {portfolio_review}
        ```

    🏦 6. Guide de Mise en Œuvre
       - Instructions d'investissement étape par étape 📝
       - Courtiers/plateformes recommandés 💻
       - Considérations fiscales 💰
       - Types de comptes à utiliser (Imposable/Retraite) 🏦

    🔄 7. Suivi et Maintenance
       - Calendrier de révision (Mensuel/Trimestriel/Annuel) 📅
       - Stratégie de rééquilibrage ⚖️
       - Indicateurs de performance clés 📊
       - Quand ajuster la stratégie 🔄

    💡 8. Ressources Additionnelles
       - Glossaire des termes 📚
       - Liste de lectures recommandées 📖
        - Contacts importants 📞
    
    📎 Annexes & Prochaines étapes
       - Validation des Tickers (du système d'intégration consolidé):
         * Tickers d'actions validés avec statut de validation et sources
         * ETFs validés avec métadonnées de validation
         * Symboles crypto validés avec alternatives pour les échecs
         * Taux de validation global et résumé par classe d'actifs
         * Suggestions d'alternatives pour les validations échouées
       - Statut de Fraîcheur des Données:
         * Crews avec données fraîches vs périmées
         * Avertissements de données périmées avec âge en heures
         * Recommandations de rafraîchissement par ordre de priorité
       - Rapport de Disponibilité des Données:
         * Statut global: COMPLETE/PARTIAL/INSUFFICIENT
         * Données manquantes par crew avec suggestions de récupération
         * Erreurs d'intégration avec actions de récupération

    Utilisez généreusement les emojis, icônes et éléments visuels pour améliorer la lisibilité.
    Incluez des en-têtes de section clairs, des listes à puces et des tableaux le cas échéant.
    Assurez-vous que le rapport est adapté aux mobiles et s'imprime bien.
  expected_output: |
    Un rapport HTML magnifiquement formaté et riche en emojis qui présente le plan financier
    de la famille de manière engageante et facile à comprendre. Le rapport doit être
    visuellement attrayant avec des en-têtes de section clairs, un style cohérent et une
    mise en page professionnelle qui rend les informations financières complexes accessibles
    à tous les membres de la famille.
    Le rapport doit être en français.
    Inclure une annexe "Corrections et Suggestions — Validation des Tickers" fondée exclusivement
    sur les annexes JSON validées des équipes (validated_tickers[], validated_etfs[], validated_symbols[]),
    ainsi qu'un court bloc JSON récapitulatif. Aucun appel externe supplémentaire ne doit être effectué.
  agent: investment_reporter
  output_file: "output/finwiz_family_financial_plan.html"
  async_execution: false
  depends_on:
    - risk_assessment_mitigation_task

