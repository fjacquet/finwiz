# ============================================================================
# REQUIRED ENUM VALUES
# ============================================================================
# This section documents all enum values used in Pydantic output schemas.
# These values must match exactly with the schema definitions.
#
# ReporterInput Schema Enums:
#   - No enums (uses nested schemas)
#
# PortfolioConfiguration Schema Enums:
#   - rebalancing_method: MINIMIZE_TRADES | MINIMIZE_COSTS | RISK_AWARE | TAX_EFFICIENT
#
# RiskAssessmentStandardized Schema Enums:
#   - risk_level: VERY_LOW | LOW | MODERATE | HIGH | VERY_HIGH
#   - risk_category: MARKET | CREDIT | LIQUIDITY | OPERATIONAL | REGULATORY | OTHER
#
# ============================================================================

# Task 1: Comprehensive Financial Integration and Opportunity Identification
comprehensive_financial_integration_task:
  description: |
    ⚠️ CRITICAL ANTI-HALLUCINATION RULES - READ FIRST ⚠️

    1. You MUST ONLY use ticker symbols from inputs.validated_tickers_list[]
    2. DO NOT invent, create, or hallucinate ANY ticker symbols under any circumstances
    3. DO NOT create fake company names, SEC filings, or URLs
    4. DO NOT use example tickers like ABC, XYZ, LMN, TEST, SAMPLE, EXAMPLE
    5. Every ticker you mention MUST exist in inputs.validated_tickers_list[]
    6. If you cannot find a ticker in validated_tickers_list, DO NOT mention it
    7. If validated_tickers_list has fewer than 3 tickers, acknowledge the limitation

    ⚠️ DATA QUALITY AND TRANSPARENCY RULES ⚠️

    1. **USE NEW DATA ACCESSORS**: All data must be accessed through validated accessors:
       - SECFilingURLGenerator for SEC filing URLs (never hardcode URLs)
       - PortfolioHoldingsProcessor for portfolio data (processes ALL holdings)
       - APlusDiscoveryAccessor for A+ opportunities (checks if discovery ran)
       - BacktestingMetricsExtractor for backtesting data (handles missing metrics)
       - DataAvailabilityTracker for data source status (tracks freshness)

    2. **DISPLAY "DATA NOT AVAILABLE" INSTEAD OF GENERATING FAKE DATA**:
       - When SEC filings are unavailable: Display "No SEC filings available"
       - When A+ discovery hasn't run: Display inputs.discovery_status.message
       - When backtesting data is missing: Display inputs.backtesting_status.message
       - When sentiment data is unavailable: Display "Sentiment data not available"
       - NEVER generate fake URLs, fake metrics, or placeholder data

    3. **INCLUDE DATA AVAILABILITY SUMMARY**:
       - Use inputs.data_availability_summary for comprehensive status
       - Display total_sources, available_sources, unavailable_sources, stale_sources
       - Show source_details for each data source (status, age, record count)
       - Include this summary in report footer and annexes section

    4. **SHOW FRESHNESS WARNINGS**:
       - Use inputs.data_availability_summary.freshness_warnings
       - Display warnings for data older than 7 days with ⚠️ icon
       - Indicate data age in days/hours
       - Recommend refreshing stale data sources

    5. **TRANSPARENT ERROR HANDLING**:
       - When data is missing: Explain why and what it means
       - When validation fails: Show which holdings failed and why
       - When URLs are invalid: Display "URL not available" instead of broken links
       - Always provide context for missing or incomplete data

    VERIFIED DATA SOURCES (use ONLY these):
    - inputs.validated_tickers_list[] - The ONLY tickers you are allowed to use
    - inputs.stock_analysis_data - Analysis for tickers in validated_tickers_list
    - inputs.etf_analysis_data - ETF analysis for validated tickers
    - inputs.crypto_analysis_data - Crypto analysis for validated symbols

    FORBIDDEN ACTIONS (will cause task failure):
    - Creating placeholder or example tickers (ABC, XYZ, etc.)
    - Inventing company names like "Alpha Beta Corp", "Lumina Networks", "Xylon Holdings"
    - Fabricating SEC filing URLs or CIK numbers
    - Using any ticker not explicitly listed in validated_tickers_list
    - Making up data when real data is unavailable

    If you find yourself wanting to create an example ticker or company name,
    STOP immediately and work only with the validated tickers provided.

    ---

    Review and synthesize investment recommendations using the integrated data system.
    Access consolidated data from Stock, ETF, Crypto, and Discovery crews through the
    integrated data context. Extract key data, analyze integrated opportunities, and
    produce a consolidated analysis with proper SEC/EDGAR citations and market sentiment.

    Key Steps:
    1. Access integrated data context containing consolidated crew outputs with metadata and freshness status.
    2. FIRST: Review inputs.validated_tickers_list[] - these are the ONLY tickers you may use.
    3. **REVIEW SEC/EDGAR CITATIONS** (ONLY for validated tickers):
       - Use ONLY URLs provided by SECFilingURLGenerator (never hardcode URLs)
       - If URL is None or empty: Display "No SEC filings available" for that ticker
       - Verify all SEC URLs are in current EDGAR format (not old formats)
       - Include filing dates and excerpts ONLY when URLs are valid
       - Never generate fake CIK numbers or filing URLs
    4. **ANALYZE MARKET SENTIMENT DATA**:
       - Use aggregated scores and top 3 sources with URLs and dates
       - If sentiment data is unavailable: Display "Sentiment data not available"
       - Verify all news URLs are real and accessible (no example.com or test URLs)
       - Include publication dates and confidence scores when available
    5. Use ONLY ticker symbols from inputs.validated_tickers_list[] - verify each ticker before mentioning it.
    6. **ACCESS A+ DISCOVERY DATA**: Use inputs.discovery_status and inputs.aplus_discovery_results:
       - Check inputs.discovery_status.has_results to determine if discovery ran
       - If has_results is False, display: inputs.discovery_status.message (e.g., "A+ discovery not run - use --discovery flag")
       - If has_results is True but no opportunities: display "No A+ opportunities found in current analysis"
       - If opportunities exist: use inputs.aplus_discovery_results for complete opportunity data
       - Use inputs.aplus_opportunities_summary for human-readable summary
    7. **ACCESS BACKTESTING DATA**: Use inputs.backtesting_status and inputs.backtesting_data:
       - Check inputs.backtesting_status.has_data to determine if backtesting data is available
       - If has_data is False, display: inputs.backtesting_status.message (e.g., "Backtesting data not available - discovery not run")
       - If has_data is True: use inputs.backtesting_data for metrics by candidate
       - For each candidate in inputs.backtesting_data:
         * metrics: annualized_return, sharpe_ratio, sortino_ratio, calmar_ratio, max_drawdown, win_rate
         * formatted_display: Human-readable formatted string
         * available_metrics: Dict with None for unavailable metrics
       - Use inputs.backtesting_summary for aggregate statistics across all candidates
       - Display "Not calculated" for metrics that are None (not "Données non disponibles")
    8. **EXTRACT MARKET CONTEXT**: From discovery crew outputs, extract:
       - regime_type (bull/bear/sideways/volatile)
       - vix_level and VIX percentile (historical context)
       - inflation_rate and interest_rate_trend (rising/falling/stable)
       - market_stress_level (low/medium/high)
       - Assessment date for context indicators
    9. **EXTRACT DISCOVERY CRITERIA**: From discovery crew methodology, extract:
       - Screening thresholds: ROE minimums, debt ratios, market cap requirements
       - Revenue growth requirements and expense ratio thresholds
       - Regime adjustment information and rationale
       - Validation statistics: total screened, candidates found, pass/fail rates
    10. **EXTRACT SCORE BREAKDOWNS**: For each A+ candidate, extract:
       - fundamental_score and technical_score (0-1 scale)
       - quality_score and risk_score components
       - composite_score and assigned grade (A+, A, B+, etc.)
    11. Identify overlapping recommendations or complementary strategies across asset classes.
    12. Evaluate the rationale and evidence provided for each recommendation, including A+ discovery insights.
    13. Prioritize opportunities based on potential returns, risk profile, backtesting performance, and alignment with family goals.
    14. Ensure all analysis considers the 1000 CHF monthly budget constraint.
    15. Handle graceful degradation for missing or stale data with clear warnings.
    16. Include data availability status and freshness warnings in the analysis.
    17. Produce a comprehensive analysis with proper source attribution and data lineage.
    18. FINAL CHECK: Verify every ticker mentioned is in inputs.validated_tickers_list[].

    Data Sources (accessed through integrated context):
    - Stock crew data: 10-K insights, validated tickers, SEC citations, market sentiments
    - ETF crew data: validated ETFs, factsheets, holdings analysis, risk assessments
    - Crypto crew data: validated symbols, crypto theses, market analysis
    - Discovery crew data (via APlusDiscoveryAccessor):
      * inputs.discovery_status: Status of discovery execution (has_results, message, status)
      * inputs.aplus_discovery_results: Complete discovery results if available
      * inputs.aplus_opportunities_summary: Human-readable summary of opportunities
      * Handles three states: not_run, no_opportunities, available
    - Consolidated market sentiment: aggregated scores, top sources with attribution
    - Consolidated ticker validation: validation status, alternatives for failed validations


    OUTPUT: A comprehensive document with integrated insights, SEC/EDGAR citations,
    market sentiment analysis, and prioritized investment opportunities.
  expected_output: >
    A structured analytical document that consolidates findings from all specialized crews
    using the integrated data system. CRITICAL: Every ticker symbol mentioned must be from
    inputs.validated_tickers_list[] - NO exceptions. The document should include:

    1. SEC/EDGAR citations with filing dates (ONLY for validated tickers)
    2. Market sentiment analysis with source attribution
    3. **A+ DISCOVERY STATUS AND OPPORTUNITIES**:
       - Discovery status: "available", "not_run", or "no_opportunities"
       - If not_run: Clear message "A+ discovery not run - use --discovery flag"
       - If no_opportunities: "No A+ opportunities found in current analysis"
       - If available: Complete opportunity data with allocation recommendations
    4. **BACKTESTING STATUS AND METRICS**:
       - Backtesting status: "available", "not_available", or "error"
       - If not_available: Clear message from inputs.backtesting_status.message
       - If available: For each A+ candidate from inputs.backtesting_data:
         * Annualized return (or "Not calculated" if None)
         * Sharpe ratio (or "Not calculated" if None)
         * Sortino ratio (or "Not calculated" if None)
         * Calmar ratio (or "Not calculated" if None)
         * Max drawdown (or "Not calculated" if None)
         * Win rate (or "Not calculated" if None)
         * Backtest period and total trades
       - Summary statistics from inputs.backtesting_summary if available
       - NEVER use "Données non disponibles" - use "Not calculated" for None values
    5. **MARKET CONTEXT INDICATORS**:
       - Current market regime type and VIX levels
       - Inflation rate and interest rate trends
       - Market stress level assessment
    6. **DISCOVERY METHODOLOGY**:
       - Screening criteria and thresholds used
       - fundamental_score and technical_score for each candidate
       - Validation statistics and success rates
    7. Clear handling of missing or stale data with warnings
    8. Verifiable data and references with proper data lineage

    DO NOT include any ticker symbols not in validated_tickers_list[].

    CRITICAL OUTPUT FORMAT:
    - Return ONLY the ReporterInput object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "report", "analysis", etc.
    - The JSON must match the ReporterInput schema exactly
    - Return the object directly without any wrapper fields


  agent: financial_integration_analyst
  output_pydantic: ReporterInput
  output_file: "output/report/consolidated_financial_analysis.json"
  async_execution: true

# Task 2: Optimal Portfolio Allocation
optimal_portfolio_allocation_task:
  description: |
    ⚠️ CRITICAL: Use ONLY tickers from inputs.validated_tickers_list[] ⚠️
    DO NOT invent or hallucinate ticker symbols. Every ticker must be validated.

    Based on the integrated data analysis, develop an optimal, diversified portfolio allocation
    strategy incorporating A+ opportunities and validated ticker symbols. Use consolidated data
    to ensure all recommendations are properly validated and include allocation updates based
    on A+ discoveries.

    Key Steps:
    1. Review the consolidated analysis with integrated data and A+ opportunities.
    2. Incorporate A+ opportunity allocation recommendations and replacement notes.
    3. Use validated ticker symbols from consolidated ticker validation results.
    4. **USE BACKTESTING SHARPE RATIOS FOR WEIGHTING**:
       - Weight allocations based on risk-adjusted returns (Sharpe ratios) from backtesting
       - Prioritize candidates with Sharpe > 1.5 for higher allocations
       - Reduce allocations for candidates with Sharpe < 1.0
       - Consider Sortino and Calmar ratios for downside risk assessment
    5. **USE REGIME CONSISTENCY FOR ASSET SELECTION**:
       - Prioritize assets with consistency_score > 0.7 across all regimes
       - Include regime-specific performers for diversification
       - Balance bull-market performers with bear-market defensive assets
       - Consider sideways market performance for stability
    6. **APPLY MARKET CONTEXT FOR ALLOCATION ADJUSTMENTS**:
       - In bull markets (low VIX): Increase growth allocation, reduce defensive positions
       - In bear markets (high VIX): Increase defensive allocation, reduce growth exposure
       - Rising rates: Favor value stocks, reduce growth/tech exposure
       - High inflation: Increase commodity/real asset exposure
       - Market stress (high): Shift to quality/defensive assets
    7. **USE TECHNICAL SCORES FOR ENTRY TIMING**:
       - technical_score > 0.7: Consider immediate entry
       - technical_score 0.5-0.7: Gradual entry over 2-3 months
       - technical_score < 0.5: Wait for better technical setup
       - Combine with fundamental_score for overall conviction
    8. Determine appropriate asset class weightings (stocks, ETFs, crypto) based on integrated risk assessments and market context.
    9. Select specific investments from validated opportunities, prioritizing A+ discoveries with strong backtesting.
    10. Allocate the 1000 CHF monthly budget across validated investments, specifying exact CHF amounts.
    11. Include portfolio allocation updates based on A+ opportunity recommendations and backtesting performance.
    12. Handle graceful degradation if A+ opportunities or backtesting data are unavailable.
    13. Justify each allocation choice with reference to backtesting metrics, regime consistency, market context, and technical scores.
    14. Ensure the portfolio is diversified and balances growth potential with capital preservation based on current market regime.

    CRITICAL OUTPUT REQUIREMENTS:
    - All holdings MUST have shares > 0 (never use 0.0 for shares)
    - Calculate actual share quantities based on CHF amounts and current prices
    - rebalancing_method MUST be one of: MINIMIZE_TRADES, MINIMIZE_COSTS, RISK_AWARE, TAX_EFFICIENT
    - target_weights MUST sum to 1.0 (100%) or less
    - Each holding symbol MUST have a corresponding target_weight

    Data Integration Features:
    - Use A+ opportunity allocation recommendations to optimize portfolio quality
    - Include replacement notes for improving existing positions
    - Reference validated ticker symbols to ensure accuracy
    - Incorporate consolidated risk assessments from all crews
    - Handle missing data gracefully with alternative recommendations

    CRITICAL OUTPUT FORMAT:
    - Return ONLY the PortfolioConfiguration object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "portfolio", "allocation", etc.
    - The JSON must match the PortfolioConfiguration schema exactly
    - Return the object directly without any wrapper fields


    OUTPUT: A detailed portfolio allocation plan with A+ opportunity integration.
  expected_output: >
    A specific and actionable portfolio allocation plan incorporating A+ opportunities and
    validated ticker symbols. The plan must include:

    1. Exact CHF amounts for each investment with percentage allocations
    2. **BACKTESTING-BASED WEIGHTINGS**: Allocation percentages justified by Sharpe ratios and risk-adjusted returns
    3. **REGIME CONSISTENCY CONSIDERATIONS**: Asset selection based on multi-regime performance
    4. **MARKET CONTEXT ADJUSTMENTS**: Defensive vs growth balance based on current VIX, rates, and regime
    5. **TECHNICAL TIMING RECOMMENDATIONS**: Entry timing (immediate/gradual/wait) based on technical scores
    6. A+ opportunity integration with replacement recommendations
    7. Clear justification for choices referencing backtesting data, regime analysis, and market context
    8. Diversification across regimes and market conditions
  agent: portfolio_allocator
  output_pydantic: PortfolioConfiguration
  output_file: "output/report/optimal_portfolio_allocation.json"
  async_execution: true
  context:
    - comprehensive_financial_integration_task

# Task 3: Risk Assessment and Mitigation Strategy
risk_assessment_mitigation_task:
  description: |
    ⚠️ CRITICAL: Use ONLY tickers from inputs.validated_tickers_list[] ⚠️
    DO NOT invent or hallucinate ticker symbols. Every ticker must be validated.

    Conduct a thorough risk assessment using consolidated risk data from all crews.
    Incorporate market sentiment analysis and A+ opportunity risk profiles to develop
    comprehensive mitigation strategies.

    Key Steps:
    1. Analyze consolidated risk assessments from stock, ETF, and crypto crews.
    2. Incorporate market sentiment analysis to assess sentiment-based risks.
    3. Evaluate A+ opportunity risk profiles and their impact on portfolio risk.
    4. **EXTRACT MAX DRAWDOWN FOR DOWNSIDE RISK**:
       - Extract max_drawdown from backtesting results for each A+ candidate
       - Identify candidates with drawdown > -25% as high downside risk
       - Calculate portfolio-level expected maximum drawdown
       - Use drawdown data to size positions appropriately
       - Consider Calmar ratio (return/drawdown) for risk-adjusted assessment
    5. **USE VIX AND MARKET STRESS FOR RISK ENVIRONMENT**:
       - vix_level < 15: Low volatility environment, normal risk tolerance
       - vix_level 15-25: Moderate volatility, balanced risk approach
       - vix_level > 25: High volatility, defensive positioning required
       - market_stress_level (low/medium/high): Adjust risk exposure accordingly
       - VIX percentile: Historical context for current volatility levels
    6. **EXTRACT REGIME-SPECIFIC RISKS**:
       - Bull market risks: Overvaluation, momentum reversal, rate sensitivity
       - Bear market risks: Drawdown extension, liquidity concerns, forced selling
       - Sideways market risks: Range-bound frustration, whipsaw losses
       - Volatile market risks: Gap risk, stop-loss failures, emotional decisions
       - Assess performance consistency across regimes for stability
    7. **INCLUDE VALIDATION FAILURE RATES AND ALTERNATIVES**:
       - Report validation failure rates by asset class
       - Identify tickers with validation issues and their alternatives
       - Assess data quality risks from failed validations
       - Recommend backup options for high-risk validations
    8. Assess portfolio-level risks using integrated data from all asset classes.
    9. Identify risks specific to validated ticker symbols and their validation status.
    10. Analyze data freshness risks and their impact on decision quality.
    11. Develop actionable mitigation strategies for each significant risk category based on backtesting and market context.
    12. Include sentiment-based risk monitoring using top sentiment sources.
    13. Recommend specific actions based on integrated risk data, drawdown analysis, and regime-specific risks.
    14. Handle graceful degradation for missing risk data with conservative assumptions.

    Integrated Risk Data Sources:
    - Consolidated risk assessments from all crews with standardized risk scores
    - Market sentiment analysis with positive/neutral/negative distribution
    - A+ opportunity risk profiles and confidence scores
    - Ticker validation status and alternative suggestions for failed validations
    - Data freshness status and staleness warnings
    - Cross-crew risk correlation analysis

    CRITICAL OUTPUT FORMAT:
    - Return ONLY the RiskAssessmentStandardized object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "risk", "assessment", etc.
    - The JSON must match the RiskAssessmentStandardized schema exactly
    - Return the object directly without any wrapper fields


    OUTPUT: A comprehensive risk assessment with integrated data and sentiment analysis.
  expected_output: >
    A detailed report identifying key risks using consolidated data from all crews.
    The report must include:

    1. Market sentiment-based risks with source attribution
    2. A+ opportunity risk analysis with risk scores
    3. **BACKTESTING DOWNSIDE RISK DATA**:
       - Maximum drawdown for each candidate and portfolio-level
       - Drawdown duration and recovery time analysis
       - Calmar ratios for risk-adjusted return assessment
       - Position sizing recommendations based on drawdown tolerance
    4. **MARKET CONTEXT RISK ASSESSMENT**:
       - VIX-based volatility risk levels (low/moderate/high)
       - Market stress level impact on portfolio
       - Interest rate and inflation risk implications
       - Current regime-specific risk factors
    5. **REGIME-SPECIFIC RISK ANALYSIS**:
       - Bull market risks: Overvaluation, momentum reversal
       - Bear market risks: Extended drawdowns, liquidity
       - Sideways market risks: Range-bound frustration
       - Volatile market risks: Gap risk, stop-loss failures
    6. **VALIDATION RISKS**:
       - Ticker validation failure rates by asset class
       - Alternative suggestions for failed validations
       - Data quality risks and mitigation
    7. Ticker validation risks and data freshness risks
    8. Practical mitigation strategies with reference to backtesting data and market context
  agent: risk_manager
  output_pydantic: RiskAssessmentStandardized
  output_file: "output/report/risk_assessment_and_mitigation.json"
  async_execution: true
  context:
    - optimal_portfolio_allocation_task

# Task 4: Comprehensive Investment Report and Implementation Plan
comprehensive_investment_report_task:
  description: |
    ⚠️⚠️⚠️ MOST CRITICAL RULE - READ THIS FIRST ⚠️⚠️⚠️

    **PORTFOLIO GRADES ARE WRONG - USE REAL GRADES FROM deep_analysis_html_content**

    The portfolio_review.holdings[] data has FAKE placeholder grades (all 0.7/C).
    The REAL grades are in inputs.deep_analysis_html_content[ticker].

    FOR EVERY HOLDING YOU MENTION:
    1. Look up ticker in inputs.deep_analysis_html_content[ticker]
    2. Use deep_analysis_html_content[ticker]['grade'] (e.g., "A-", "A", "B+")
    3. Use deep_analysis_html_content[ticker]['composite_score'] (e.g., 0.82, 0.86)
    4. **EXTRACT CURRENT PRICE**: Use deep_analysis_html_content[ticker]['current_price'] for the "Prix Actuel" column
    5. If current_price is not available: Display "N/A" or "Prix non disponible"
    6. NEVER use portfolio_review.holdings[].grade or .composite_score (they are fake 0.7/C)

    Example:
    - AAPL: Use deep_analysis_html_content["AAPL"] = {grade: "A-", composite_score: 0.82} ✅
    - MSFT: Use deep_analysis_html_content["MSFT"] = {grade: "A", composite_score: 0.86} ✅
    - DO NOT use portfolio_review grade C/0.7 ❌

    ---

    ⚠️ CRITICAL ANTI-HALLUCINATION RULES ⚠️

    1. You MUST ONLY use ticker symbols from inputs.validated_tickers_list[]
    2. DO NOT invent ticker symbols like ABC, XYZ, LMN, TEST, SAMPLE
    3. DO NOT create fake company names like "Alpha Beta Corp", "Lumina Networks", "Xylon Holdings"
    4. DO NOT fabricate SEC filing URLs or CIK numbers
    5. Every ticker in the HTML report MUST be from validated_tickers_list[]
    6. If a ticker is not in validated_tickers_list[], DO NOT include it in the report

    Read the consolidated analysis from previous tasks, but VERIFY every ticker against
    inputs.validated_tickers_list[] before including it in the HTML report.

    ---

    ⚠️ CRITICAL URL REQUIREMENTS - READ FIRST ⚠️

    **ABSOLUTE PROHIBITION ON FAKE URLS**:
    - ❌ NEVER EVER use example.com, test.com, sample.com, or any placeholder URLs
    - ❌ NEVER invent or hallucinate URLs - if you don't have a real URL, write "Source: Internal analysis" or "URL not available"
    - ✅ ONLY use real URLs from upstream data (sentiment tools, SEC filings, etc.)
    - ✅ If sentiment data has no URL: write "Source: [Tool Name] - URL not provided"
    - ✅ For SEC data: Use SECFilingURLGenerator or write "SEC EDGAR Database (search at sec.gov/edgar)"

    **EXAMPLES OF CORRECT CITATIONS**:
