# Export Generation Task
generate_export_task:
  description: >
    Consolidate all ETF analysis findings from context into an ETFCrewExport object.

    CRITICAL: This is a FINAL REPORTER task - you have NO TOOLS. Use ONLY the context
    from previous tasks to extract all required information.

    CONTEXT SOURCES:
    - etf_market_trends_task: Market trends and ETF landscape
    - etf_screening_task: ETF screening results
    - etf_technical_detail_task: ETF factsheet, holdings, technical analysis
    - etf_risk_assessment_task: Risk assessment and risk scores
    - etf_investment_strategy_task: Investment strategy and recommendations

    REQUIRED FIELDS TO EXTRACT FROM CONTEXT:
    1. factsheet (ETFFactsheet):
       - Extract from etf_technical_detail_task context
       - Include fund_name, ticker, expense_ratio, aum, inception_date, etc.

    2. top_holdings (List[ETFTopHolding]):
       - Extract from etf_technical_detail_task context
       - Include ticker, name, weight, sector for top holdings

    3. risk_assessment (RiskAssessmentStandardized):
       - Extract from etf_risk_assessment_task context
       - Include risk_score (0-5), risk_factors, systematic_risk, idiosyncratic_risk

    4. composite_score (float 0.0-1.0):
       - Calculate based on all analysis dimensions
       - Weight: 30% expense ratio, 30% tracking error, 40% risk
       - Formula: (expense_score * 0.3) + (tracking_score * 0.3) + ((5 - risk_score) / 5 * 0.4)

    5. grade (A+ to F):
       - A+: composite_score >= 0.85
       - A: composite_score >= 0.75
       - B: composite_score >= 0.65
       - C: composite_score >= 0.55
       - D: composite_score >= 0.45
       - F: composite_score < 0.45

    6. expense_ratio (float):
       - Extract from factsheet
       - Total expense ratio as percentage

    7. tracking_error (Optional[float]):
       - Extract from factsheet if available
       - Tracking error vs benchmark

    8. recommendation (BUY/HOLD/SELL):
       - BUY: grade >= B AND low expense ratio AND low tracking error
       - HOLD: grade = C OR moderate costs
       - SELL: grade <= D OR high costs

    9. confidence (float 0.0-1.0):
       - Based on data quality and consistency across analyses
       - High confidence (0.8-1.0): All analyses agree, strong signals
       - Medium confidence (0.5-0.8): Some disagreement, mixed signals
       - Low confidence (0.0-0.5): Conflicting analyses, weak signals

    10. rationale (string, min 50 chars):
        - Explain the recommendation based on all analysis findings
        - Reference specific metrics from factsheet
        - Address expense ratio, tracking error, holdings quality
        - Mention risk factors and diversification benefits

    11. data_sources (list of strings):
        - List all data sources used: ["Yahoo Finance", "ETF.com", "Morningstar", etc.]

    12. report_html_path (string):
        - Set to: "output/reports/{session_id}/etf_crew/{ticker}_report.html"

    13. report_json_path (string):
        - Set to: "output/reports/{session_id}/etf_crew/{ticker}_export.json"

    METADATA FIELDS (auto-populated):
    - crew_name: "etf_crew" (default)
    - ticker: From input parameter {ticker}
    - asset_class: "etf" (default)
    - session_id: From input parameter {session_id}
    - analysis_date: Current timestamp (auto-generated)

    OUTPUT FORMAT:
    - Return a valid ETFCrewExport Pydantic object
    - All fields must conform to schema validation
    - Use extra='forbid' - no additional fields allowed
    - Ensure all required fields are present

    VALIDATION:
    - composite_score must be between 0.0 and 1.0
    - grade must be one of: A+, A, B, C, D, F
    - recommendation must be one of: BUY, HOLD, SELL
    - confidence must be between 0.0 and 1.0
    - rationale must be at least 50 characters
    - expense_ratio must be between 0.0 and 5.0
    - All nested objects must conform to their schemas

    Today is {full_date}. Use this date for analysis_date if not auto-generated.


  expected_output: >
    A validated ETFCrewExport Pydantic object containing all analysis findings,
    factsheet data, holdings, scores, grades, and recommendations. The object will
    be automatically saved to JSON at the specified report_json_path.
  agent: investment_reporter
  output_pydantic: ETFCrewExport
  async_execution: false
  context:
    - etf_investment_strategy_task
