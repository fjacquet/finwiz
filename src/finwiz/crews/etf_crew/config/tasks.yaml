# ============================================================================
# DISCOVERY CREW - Designed to screen and identify top 10 assets
# ============================================================================
# For single-ticker deep analysis, use DeepAnalysisCrew instead
# Runs AFTER portfolio analysis to find NEW opportunities
# ============================================================================

# ETF Market Analysis Tasks
etf_market_trends_task:
  description: >
    FIRST: Read the schema file src/finwiz/schemas/etf.py (ETFMarketTrend class) to understand 
    the exact output format required.
    
    Research and identify current market trends and emerging sectors in the ETF space.
    
    1. Identify key ETF market trends
    2. Analyze global economic factors impacting ETF categories
    3. Examine liquidity and volume trends across ETF segments
    4. Research regulatory developments affecting ETF structures
    5. Prefer the "Alpha Vantage News Sentiment" tool to summarize structured news/sentiment for
       key ETFs and sectors; complement with `YahooFinanceNewsTool` when needed.
    
    Today is {full_date}. Ensure your analysis reflects current market conditions.
    
    CRITICAL OUTPUT FORMAT:
    - Return ONLY the ETFMarketTrend object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "trends", "analysis", etc.
    - The JSON must match the ETFMarketTrend schema exactly
    
    OUTPUT: Return a structured JSON output conforming to the ETFMarketTrend schema.
  expected_output: >
    A structured analysis of current ETF market trends conforming to the ETFMarketTrend 
    Pydantic schema. Include growth trends, global factors, and market insights.
    
    IMPORTANT: Return the object directly without any wrapper fields.
  agent: market_etf_analyst
  output_pydantic: ETFMarketTrend
  output_file: "output/etf/etf_market_trends.json"
  async_execution: true

# ETF Screening Tasks
etf_screening_task:
  description: >
    Screen and identify the top 10 most stable and diversified ETFs for long-term investment.
    
    CRITICAL DATE CONTEXT:
    - TODAY'S DATE IS {full_date} - Use this as your reference point for "current" market conditions
    - All analysis must reflect market conditions as of {full_date}, NOT historical dates
    - When searching or analyzing, use {full_date} as the current date context

    SCREENING PROCESS:
    1. Screen ETFs using stability and diversification metrics:
       - Evaluate volatility, tracking error, and correlation data
       - Assess diversification quality and risk-return profiles
    2. Assess cost efficiency and tax implications:
       - Evaluate expense ratios in context of fund value proposition
       - Consider tax efficiency and total cost of ownership
    3. Assess fund reliability and operational quality:
       - Evaluate tracking error, fund size, and liquidity
       - Consider operational risks and fund management quality
    4. Select optimal ETFs:
       - Balance multiple factors and investor objectives
       - Consider portfolio fit and strategic allocation
    5. Validate each proposed ETF ticker using the "Ticker Existence Validation Tool":
       - Pass ONLY the ticker symbol and asset_class to the tool
       - Example input: {"symbol": "VOO", "asset_class": "etf"}
       - Do NOT pass the validation result back to the tool
       - Use Yahoo Finance existence and ensure quoteType is ETF
       - Auto-correct obvious symbol issues (case/typos); otherwise discard invalid ones

    OUTPUT REQUIREMENTS:
    - Include clear rationale for each ETF selection
    - Provide confidence levels and risk assessments
    - Synthesize quantitative and qualitative factors
    - Provide actionable insights

    IMPORTANT: Use only real, existing ETFs with accurate ticker symbols. Ensure your analysis 
    is current as of {full_date}.
    
    CRITICAL OUTPUT FORMAT:
    - Return ONLY the ETFScreeningResult object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "results", "etfs", etc.
    - The JSON must match the ETFScreeningResult schema exactly
    
    OUTPUT: Return a structured JSON output conforming to the ETFScreeningResult schema.
  expected_output: >
    A structured list of 10 stable, diversified ETFs conforming to the ETFScreeningResult 
    Pydantic schema. Include analysis, validation status, and AI-driven insights.
    
    IMPORTANT: Return the object directly without any wrapper fields.
  agent: market_etf_analyst
  output_pydantic: ETFScreeningResult
  output_file: "output/etf/high_potential_etfs.json"
  async_execution: true

# ETF Technical Detail Tasks
etf_technical_detail_task:
  description: >
    FIRST: Read the schema files:
    - src/finwiz/schemas/etf.py (ETFTechnicalAnalysis and ETFFactsheet classes)
    - docs/schemas/ETFFactsheet.schema.json
    - docs/schemas/examples/etf_factsheet.example.json
    to understand the exact output format required.
    
    Perform detailed technical analysis on each of the 10 selected ETFs from the screening task.
    
    1. Analyze replication methods and lending practices, considering any recent changes as of {full_date}.
    2. Evaluate tracking accuracy and benchmark adherence using the latest performance data.
    3. Assess fund manager expertise and issuer stability based on current information.
    4. Examine historical performance against benchmarks up to {full_date}.
    5. Use the "Enhanced ETF Analysis Tool" to extract comprehensive factsheet data for each ETF including:
       - Expense ratios and tracking differences with proper validation
       - Top holdings with weights and provenance (ticker, weight_pct, as_of, source_url)
       - Issuer information and replication methods
       - Factsheet highlights and key metrics
    6. Use the "ETF Tracking Analysis Tool" to analyze tracking performance against benchmarks.
    7. Technical indicators: Use the "Twelve Data Indicator" tool to fetch RSI/MACD/Bollinger Bands
       for relevant intervals per ETF, and cite parameters used.
    8. Quantitative analysis: Use the "Quantitative Analysis Tool" to perform comprehensive quantitative analysis
       for each ETF including:
       - Technical analysis with ETF-specific indicators and signal generation
       - Strategy backtesting with tracking error analysis against benchmarks
       - Performance metrics calculation including correlation analysis with underlying assets
       - Use asset_class="etf" and analysis_type="comprehensive" for complete ETF analysis
    9. Charts: Generate visuals with the "Chart-img Generator" tool and embed returned data URLs in the report.
    
    CRITICAL OUTPUT FORMAT:
    - Return ONLY the ETFTechnicalAnalysis object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "analysis", "results", etc.
    - The JSON must match the ETFTechnicalAnalysis schema exactly
    
    REQUIRED ENUM VALUES (use EXACTLY these values):
    - factsheet.replication_method: MUST be one of: "physical", "synthetic", "optimized", "other" (lowercase)
    - quantitative_metrics.recommendation: MUST be one of: "BUY", "HOLD", "SELL" (uppercase, if provided)
    
    OUTPUT: Return a structured JSON output conforming to the ETFTechnicalAnalysis schema.
  expected_output: >
    A structured technical assessment of each ETF conforming to the ETFTechnicalAnalysis 
    Pydantic schema. Include ETF structure, tracking accuracy, liquidity profile, fund 
    management, quantitative analysis, factsheet highlights, and top holdings.

    CRITICAL SCHEMA REQUIREMENTS:
    - Read docs/schemas/ETFFactsheet.schema.json and docs/schemas/ETFTopHolding.schema.json
    - Read docs/schemas/examples/etf_factsheet.example.json for correct format
    - Follow the exact schema structure shown in the example files
    - Ensure all required fields are included with correct data types
    - Return the object directly without any wrapper fields
  agent: market_etf_analyst
  output_pydantic: ETFTechnicalAnalysis
  output_file: "output/etf/etf_technical_details.json"
  async_execution: true
  depends_on:
    - etf_screening_task

# Risk Analysis Tasks
etf_risk_assessment_task:
  description: >
    FIRST: Read the schema files:
    - src/finwiz/schemas/common.py (RiskAssessmentStandardized class)
    - docs/schemas/RiskAssessmentStandardized.schema.json
    to understand the exact output format required.
    
    Evaluate risks for each of the 10 ETFs identified in previous tasks.
    
    1. Use the "Enhanced ETF Analysis Tool" with risk assessment enabled to perform standardized risk scoring.
    2. Assess volatility metrics and historical drawdowns using data up to {full_date}.
    3. Identify concentration risks within ETF holdings based on the latest disclosures from factsheet analysis.
    4. Analyze liquidity risks during market stress scenarios, considering current market conditions as of {full_date}.
    5. Evaluate counterparty and structural risks based on replication methods and issuer stability.
    6. Review regulatory and tax considerations relevant for {current_year}.
    7. Apply the "Standardized Risk Scoring Tool" methodology for consistent 0-5 risk scores across all ETFs.
    8. Quantitative risk assessment: Use the "Quantitative Analysis Tool" with analysis_type="performance"
       to calculate ETF-specific risk metrics including:
       - Tracking error and correlation analysis with benchmark indices
       - Volatility decomposition and risk attribution analysis
       - Performance metrics during market stress periods
       - Liquidity risk assessment and bid-ask spread analysis
    9. Market sentiment: Use the "Standardized Sentiment Analysis Tool" for consistent ETF sentiment analysis.
       - Apply standardized cross-asset sentiment methodology for ETFs
       - Provide weighted sentiment scores and confidence intervals
       - Extract trending topics relevant to ETF sectors and holdings
       - Include top positive/negative headlines with URLs and dates
       - Ensure sentiment scoring consistency with stock and crypto analysis
    
    REQUIRED ENUM VALUES (use EXACTLY these values):
    - risk_assessment.scale: MUST be "0_5" (for 0-5 scale, this is the default and standard)
    - risk_assessment.level: MUST be one of: "Low", "Medium", "High", "Very High" (capitalized, no other values allowed)
    
    Follow the output instructions in docs/output_formatting_guide.md. Ensure your risk assessment is based on information available as of {full_date}.
  expected_output: >
    A detailed risk profile for each ETF covering volatility, concentration, liquidity, counterparty, and regulatory risks.
    Include standardized risk scores (0-5 scale) with consistent methodology across all ETFs.
    Also include a machine-readable JSON appendix containing:
    - risk_assessments[] matching the RiskAssessmentStandardized schema for each ETF
  agent: risk_assessor
  output_file: "output/etf/etf_risk_assessment.json"
  async_execution: false
  depends_on:
    - etf_technical_detail_task

# Investment Strategy Tasks
etf_investment_strategy_task:
  description: >
    Develop investment strategies for each of the 10 ETFs based on their risk profiles and technical analysis.
    
    1. Determine optimal entry price points and target valuations
    2. Recommend position sizing based on risk/reward profiles
    3. Define time horizons for expected returns
    4. Create portfolio allocation strategies and diversification approaches
    5. Develop specific risk management tactics for each ETF
    
    Consider all factors known as of {timestamp} and use {current_year} regulatory standards.
    Base your investment recommendations on current market conditions as of {full_date}.
  expected_output: >
    Investment strategies for each ETF including entry points, position sizing,
     time horizons, and risk management tactics.
    The report should be formatted in HTML with emojis for better
    visualization.
  agent: risk_assessor
  output_file: "output/etf/etf_investment_strategies_en.html"
  async_execution: false
  depends_on:
    - etf_risk_assessment_task

