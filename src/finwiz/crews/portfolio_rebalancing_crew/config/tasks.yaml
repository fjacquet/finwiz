# Individual Holding Analysis Tasks
analyze_holding_task:
  description: >
    FIRST: Read the schema file docs/schemas/HoldingDecision.schema.json to understand the exact output format required.

    Analyze individual portfolio holding using appropriate crew (stock/ETF/crypto) and map outputs to schema.

    This task coordinates deep analysis for a single holding by checking for cached crew analysis,
    triggering fresh analysis if needed, and mapping crew outputs to the portfolio review schema.

    1. Use HoldingAnalyzerOrchestrator to check for cached analysis (< 7 days old).
    2. If cache miss or stale, trigger appropriate crew based on asset class:
       - Stock holdings → stock_crew
       - ETF holdings → etf_crew
       - Crypto holdings → crypto_crew
    3. Map crew-specific outputs to standardized schema:
       - fundamental_analysis: Extract key metrics and insights
       - technical_analysis: Extract indicators and patterns
       - sec_citations: Extract regulatory filings (stocks only)
    4. Set data_freshness indicator (fresh/recent/stale).
    5. Handle failures gracefully with baseline analysis fallback.

    INPUT: Ticker symbol, asset class, currency, holding name

    ⚠️ CRITICAL ANTI-HALLUCINATION RULES:
    - NEVER invent or guess URLs, ISINs, or company names
    - NEVER fabricate financial metrics or prices
    - If data is missing, explicitly state "Données non disponibles"
    - All URLs must come from verified data sources
    - Cross-reference data points before including in output

    CRITICAL OUTPUT FORMAT:
    - Return ONLY the HoldingDecision object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "results", "analysis", etc.
    - The JSON must match the HoldingDecision schema exactly

    REQUIRED ENUM VALUES (use EXACTLY these values):
    - decision: MUST be one of: "KEEP", "SELL" (uppercase, no other values allowed)
    - asset_class: MUST be one of: "stock", "etf", "crypto" (lowercase, no other values allowed)
    - grade: MUST be one of: "A+", "A", "B+", "B", "C+", "C", "D", "F" (exact format with capitalization and plus signs)
    - risk.scale: MUST be "0_5" (for 0-5 scale, not "L_M_H" or "L_M_H_VH")
    - risk.level: MUST be one of: "Low", "Medium", "High", "Very High" (capitalized first letter only)

    OUTPUT: Return a structured JSON output conforming to the HoldingDecision schema.
    🚨 JSON OUTPUT REQUIREMENTS 🚨
    - Output MUST be ONLY valid JSON - no explanatory text before or after
    - Your ENTIRE response must be a single JSON object starting with { and ending with }
    - Do NOT include any text, comments, or explanations outside the JSON
    - CRITICAL: NO trailing commas in JSON - last item in arrays/objects must NOT have comma
  expected_output: >
    A structured complete HoldingDecision object conforming to the HoldingDecision Pydantic
    schema. Include fundamental/technical analysis, SEC citations (if applicable), data
    freshness indicator, crew analysis source, confidence level, and composite score.

    IMPORTANT: Return the object directly without any wrapper fields.
  agent: holding_analyzer
  output_pydantic: HoldingDecision
  output_file: "output/portfolio/holding_analysis.json"
  async_execution: true

calculate_price_targets_task:
  description: >
    Calculate actionable buy/sell price targets for a portfolio holding.

    This task generates specific price targets that investors can use to execute trades, including
    buy-on-dip levels, profit-taking targets, and stop-loss levels for risk management.

    1. Use PriceTargetCalculator to calculate fair value estimate:
       - Stocks: DCF, P/E, book value methods
       - ETFs: NAV analysis with tracking error adjustment
       - Crypto: Technical analysis (fair value less applicable)
    2. Calculate technical support and resistance levels from price history.
    3. Generate buy targets based on recommendation:
       - KEEP: Accumulation levels on dips
       - BUY: Initial entry and scale-in levels
       - SELL: Not applicable
    4. Generate sell targets for all recommendations:
       - Profit-taking levels at resistance
       - Stop-loss for risk management
    5. Provide clear rationale in French for each target level.
    6. Ensure all targets are in holding's native currency.

    INPUT: Ticker, asset class, current price, price history, fundamental data, recommendation

    CRITICAL OUTPUT FORMAT:
    - Return ONLY the PriceTargets object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "results", "targets", etc.
    - The JSON must match the PriceTargets schema exactly

    OUTPUT: Return a structured JSON output conforming to the PriceTargets schema.
    🚨 JSON OUTPUT REQUIREMENTS 🚨
    - Output MUST be ONLY valid JSON - no explanatory text before or after
    - Your ENTIRE response must be a single JSON object starting with { and ending with }
    - Do NOT include any text, comments, or explanations outside the JSON
    - CRITICAL: NO trailing commas in JSON - last item in arrays/objects must NOT have comma
  expected_output: >
    A structured complete PriceTargets object conforming to the PriceTargets Pydantic schema.
    Include current price, fair value estimate, buy targets (primary/secondary), sell targets
    (primary/secondary), stop-loss level, support/resistance levels, calculation method,
    confidence level, and French rationale for each target.

    IMPORTANT: Return the object directly without any wrapper fields.
  agent: price_target_specialist
  output_pydantic: PriceTargets
  output_file: "output/portfolio/price_targets.json"
  async_execution: true
  context:
    - analyze_holding_task

find_alternatives_task:
  description: >
    FIRST: Read the schema file docs/schemas/Alternative.schema.json to understand the exact output format required.

    Find better investment alternatives for underperforming holdings (graded below B).

    This task identifies superior alternatives that match the holding's sector/exposure while
    offering better fundamentals, lower costs, or higher quality. Prioritizes A+ candidates
    from the investment discovery crew.

    1. Use AlternativeFinder to check if holding needs alternatives (grade < B).
    2. Search for A+ candidates from discovery crew outputs matching:
       - Same asset class
       - Similar sector/exposure
       - Better metrics (lower fees, better fundamentals, higher liquidity)
    3. For each alternative found, calculate:
       - Grade improvement (e.g., D to A+ = 6 levels)
       - Expense ratio savings (ETFs)
       - Fundamental improvements (stocks)
       - Liquidity improvements (crypto)
    4. Generate transition strategy based on grade improvement:
       - Immediate: For 4+ level improvements
       - Gradual: For 2-3 level improvements
       - Tax-optimized: For 1 level improvement
    5. Provide tax implications and expected benefits in French.
    6. Limit to top 2-3 alternatives per holding.

    INPUT: Holding profile (ticker, grade, asset class, sector, metrics)

    CRITICAL OUTPUT FORMAT:
    - Return ONLY the Alternative object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "results", "alternatives", etc.
    - The JSON must match the Alternative schema exactly

    REQUIRED ENUM VALUES (use EXACTLY these values):
    - asset_class: MUST be one of: "stock", "etf", "crypto" (lowercase, no other values allowed)
    - grade: MUST be one of: "A+", "A", "B+", "B", "C+", "C", "D", "F" (exact format with capitalization and plus signs)

    OUTPUT: Return a structured JSON output conforming to the Alternative schema.
    🚨 JSON OUTPUT REQUIREMENTS 🚨
    - Output MUST be ONLY valid JSON - no explanatory text before or after
    - Your ENTIRE response must be a single JSON object starting with { and ending with }
    - Do NOT include any text, comments, or explanations outside the JSON
    - CRITICAL: NO trailing commas in JSON - last item in arrays/objects must NOT have comma
  expected_output: >
    A structured list of 0-3 Alternative objects conforming to the Alternative Pydantic schema
    for holdings graded below B. Each alternative includes ticker, name, grade, composite score,
    key metrics, thesis bullets, transition strategy (immediate/gradual/tax-optimized), tax
    implications, and expected improvements. Empty list for holdings graded B or above.

    IMPORTANT: Return the object directly without any wrapper fields.
  agent: alternative_researcher
  output_pydantic: Alternative
  output_file: "output/portfolio/alternatives.json"
  async_execution: true
  context:
    - analyze_holding_task

# Portfolio Analysis Tasks
portfolio_analysis_task:
  description: >
    Analyze current portfolio composition and calculate precise weightings against target allocations.

    This task involves comprehensive analysis of the current portfolio holdings, calculation of
    accurate market-weighted allocations, and identification of deviations from target weightings.

    1. Retrieve current market prices for all portfolio holdings as of {full_date}.
    2. For each holding, use HoldingAnalyzerOrchestrator to get deep analysis:
       - Check for cached crew analysis (< 7 days old)
       - Trigger appropriate crew (stock/ETF/crypto) if needed
       - Map crew outputs to portfolio schema
    3. Calculate total portfolio value and individual position weightings.
    4. Compare current weightings against target allocations to identify drift.
    5. Analyze portfolio risk characteristics and concentration metrics.
    6. Identify positions that require rebalancing based on tolerance thresholds.
    7. Use the "Quantitative Analysis Tool" with analysis_type="portfolio" to perform:
       - Portfolio composition analysis with sector and asset class breakdowns
       - Risk metrics calculation including portfolio beta, volatility, and correlation analysis
       - Performance attribution analysis for current vs target allocations
       - Diversification metrics and concentration risk assessment
    8. Store portfolio analysis results in the knowledge base for team collaboration.

    Today is {full_date}. Ensure your analysis reflects current market conditions and prices.
    Use the portfolio configuration provided in the input parameters.

    CRITICAL OUTPUT FORMAT:
    - Return ONLY the PortfolioAnalysis object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "results", "analysis", etc.
    - The JSON must match the PortfolioAnalysis schema exactly

    REQUIRED ENUM VALUES (use EXACTLY these values):
    - For any position sizing recommendations, sizing_action: MUST be one of: "add", "trim", "hold", "exit" (lowercase, no other values allowed)

    OUTPUT: Return a structured JSON output conforming to the PortfolioAnalysis schema.
    🚨 JSON OUTPUT REQUIREMENTS 🚨
    - Output MUST be ONLY valid JSON - no explanatory text before or after
    - Your ENTIRE response must be a single JSON object starting with { and ending with }
    - Do NOT include any text, comments, or explanations outside the JSON
    - CRITICAL: NO trailing commas in JSON - last item in arrays/objects must NOT have comma
  expected_output: >
    A structured comprehensive portfolio analysis conforming to the PortfolioAnalysis Pydantic
    schema. Include current weightings, target deviations, risk metrics, positions requiring
    rebalancing, quantitative portfolio metrics, and risk assessment. Each holding should have
    deep analysis from appropriate crew with data freshness indicators.

    IMPORTANT: Return the object directly without any wrapper fields.
  agent: portfolio_analyst
  output_pydantic: PortfolioAnalysis
  output_file: "output/portfolio/portfolio_composition_analysis.json"
  async_execution: true
  context:
    - analyze_holding_task
    - calculate_price_targets_task
    - find_alternatives_task

# Rebalancing Optimization Tasks
rebalancing_optimization_task:
  description: >
    Generate optimal trade recommendations to rebalance the portfolio to target allocations.

    This task involves sophisticated optimization to determine the most cost-effective trades
    needed to bring the portfolio back into alignment with target weightings.

    1. Retrieve portfolio analysis results from the previous task and knowledge base.
    2. For each holding, use PriceTargetCalculator to get actionable price targets:
       - Buy targets (accumulation levels)
       - Sell targets (profit-taking levels)
       - Stop-loss levels (risk management)
    3. For underperforming holdings (grade < B), use AlternativeFinder to identify:
       - A+ alternatives from discovery crew
       - Better sector/exposure matches
       - Lower-cost alternatives (ETFs)
       - Transition strategies (immediate/gradual/tax-optimized)
    4. Calculate required trade quantities for each position to achieve target weightings.
    5. Optimize trade recommendations to minimize total transaction costs and market impact.
    6. Consider available capital constraints and minimum trade size requirements.
    7. Prioritize trades based on deviation magnitude and cost-benefit analysis.
    8. Use the "Quantitative Analysis Tool" with analysis_type="optimization" to perform:
       - Multi-objective portfolio optimization with cost minimization
       - Constraint handling for capital limits, position sizes, and trading restrictions
       - Scenario analysis for different rebalancing approaches
       - Sensitivity analysis for parameter variations
    9. Generate detailed trade recommendations with rationale and cost estimates.
    10. Store optimization results and trade recommendations in the knowledge base.

    Consider transaction costs, market impact, and practical trading constraints in your optimization.
    Ensure recommendations are actionable and cost-effective.

    CRITICAL OUTPUT FORMAT:
    - Return ONLY the RebalancingRecommendation object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "results", "recommendations", etc.
    - The JSON must match the RebalancingRecommendation schema exactly

    REQUIRED ENUM VALUES (use EXACTLY these values):
    - For any risk assessments, risk_assessment.scale: MUST be "0_5" (for 0-5 scale, not "L_M_H" or "L_M_H_VH")
    - For any risk assessments, risk_assessment.level: MUST be one of: "Low", "Medium", "High", "Very High" (capitalized first letter only)

    OUTPUT: Return a structured JSON output conforming to the RebalancingRecommendation schema.
    🚨 JSON OUTPUT REQUIREMENTS 🚨
    - Output MUST be ONLY valid JSON - no explanatory text before or after
    - Your ENTIRE response must be a single JSON object starting with { and ending with }
    - Do NOT include any text, comments, or explanations outside the JSON
    - CRITICAL: NO trailing commas in JSON - last item in arrays/objects must NOT have comma
  expected_output: >
    A structured detailed trade recommendations conforming to the RebalancingRecommendation
    Pydantic schema. Include buy/sell quantities, estimated costs, priority rankings,
    optimization analysis, price targets for each holding, alternatives for underperforming
    positions, transition strategies, and cost-benefit analysis.

    IMPORTANT: Return the object directly without any wrapper fields.
  agent: rebalancing_strategist
  output_pydantic: RebalancingRecommendation
  output_file: "output/portfolio/rebalancing_trade_recommendations.json"
  async_execution: true
  context:
    - portfolio_analysis_task

# Risk Validation Tasks
risk_validation_task:
  description: >
    Validate rebalancing recommendations against risk constraints and investment policies.

    This task involves comprehensive risk assessment of the proposed rebalancing trades
    to ensure compliance with risk management policies and investment mandates.

    1. Retrieve trade recommendations from the rebalancing optimization task.
    2. For each holding, use PositionSizingTool to calculate optimal position sizes:
       - Risk-based sizing (high/medium/low risk)
       - Correlation with existing portfolio
       - Concentration limits (single stock 10%, sector 35%)
       - Sizing actions (add/trim/hold/exit)
    3. Validate that recommended allocations sum to 100% across portfolio.
    4. Assess concentration risk and position size limits for proposed portfolio changes.
    5. Validate compliance with investment policy constraints and risk tolerance parameters.
    6. Analyze potential market impact and liquidity risks of recommended trades.
    7. Evaluate tax implications and regulatory considerations for proposed changes.
    8. Use the "Quantitative Analysis Tool" with analysis_type="risk" to perform:
       - Value at Risk (VaR) and Conditional VaR calculations for the rebalanced portfolio
       - Stress testing and scenario analysis for adverse market conditions
       - Risk-adjusted performance projections and Sharpe ratio analysis
       - Correlation and beta analysis for the proposed portfolio composition
    9. Generate risk assessment scores using standardized 1-10 risk scoring methodology.
    10. Provide risk mitigation recommendations and alternative approaches if needed.
    11. Store risk validation results and compliance status in the knowledge base.

    Follow the standardized risk assessment framework and ensure all recommendations
    comply with established risk management policies.

    OUTPUT: Return comprehensive risk validation with compliance status, position sizing recommendations, and mitigation strategies.
    🚨 JSON OUTPUT REQUIREMENTS 🚨
    - Output MUST be ONLY valid JSON - no explanatory text before or after
    - Your ENTIRE response must be a single JSON object starting with { and ending with }
    - Do NOT include any text, comments, or explanations outside the JSON
    - CRITICAL: NO trailing commas in JSON - last item in arrays/objects must NOT have comma
  expected_output: >
    A detailed risk assessment of rebalancing recommendations including compliance validation,
    risk scores, stress test results, position sizing recommendations, and mitigation strategies.
    The report should be formatted in professional HTML with clear risk indicators and actionable recommendations.
    Also include a machine-readable JSON appendix containing:
    - risk_assessments[] matching the RiskAssessmentStandardized schema
    - position_sizing_recommendations[] with optimal allocations
    - compliance_validation with detailed policy adherence analysis
    - quantitative_risk_metrics[] with comprehensive risk analysis results
  agent: risk_manager
  output_file: "output/portfolio/portfolio_rebalancing_risk_validation.html"
  async_execution: true
  context:
    - rebalancing_optimization_task

