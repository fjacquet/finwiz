market_analysis_task:
  description: >
    Analyze the current cryptocurrency market trends, sentiment, and news.
    Identify the top 10 promising cryptocurrencies with high growth potential for the current date of {full_date}.
    
    Validation Requirement:
    - For every proposed symbol, use the "Ticker Existence Validation Tool" (crypto path) to verify listing on Coinbase Products.
    - Auto-correct obvious symbol issues (case/typos); otherwise discard invalid ones.
    
    Sentiment Analysis:
    - Use the "Standardized Sentiment Analysis Tool" with asset_class="crypto" for consistent methodology
    - Apply standardized cross-asset sentiment scoring for cryptocurrency analysis
    - Extract trending topics relevant to crypto markets and blockchain technology
    - Provide weighted sentiment scores and confidence intervals for each cryptocurrency
  expected_output: >
    A list of the top 10 promising cryptocurrencies with a brief analysis of each.
    
    Also include a machine-readable JSON appendix at the end containing:
    - validated_symbols[] where each item is {symbol, asset_class, valid, reason, meta}
    - crypto_theses[] matching the CryptoThesis schema with initial thesis bullets
  agent: market_analyst
  output_file: "output/crypto/crypto_market_analysis.md"

technical_analysis_task:
  description: >
    Conduct a detailed technical analysis of the cryptocurrencies provided by
    the market analyst. Identify potential entry and exit points, support and
    resistance levels, and overall price trends for the top 10 projects.
    
    Technical Indicators & Charts:
    - Use the "Twelve Data Indicator" tool to fetch RSI/MACD/Bollinger Bands for relevant intervals (if the symbol/interval is supported),
      and cite the parameters used.
    - Generate charts with the "Chart-img Generator" tool and embed returned data URLs directly in the report.
  expected_output: >
    A technical analysis report for the top 10 cryptocurrencies, including
    chart patterns and key price levels.
  agent: technical_analyst
  output_file: "output/crypto/crypto_technical_analysis.md"

risk_assessment_task:
  description: >
    Evaluate the risks associated with the top 10 cryptocurrencies identified
    by the technical analyst. Use the "Enhanced Crypto Analysis Tool" with risk assessment
    enabled to perform standardized crypto risk scoring.
    
    Enhanced Risk Assessment:
    - Use the "Enhanced Crypto Analysis Tool" for comprehensive risk analysis of each cryptocurrency
    - Apply the "Crypto Risk Scoring Tool" methodology for consistent 0-5 risk scores
    - Focus on crypto-specific risks: volatility, regulatory uncertainty, technology risks, market manipulation
    - Assess tokenomics, supply dynamics, and adoption risks
    
    Sentiment Analysis:
    - Use the "Standardized Sentiment Analysis Tool" with asset_class="crypto" for consistent sentiment methodology
    - Apply standardized cross-asset sentiment scoring with crypto-specific considerations
    - Extract trending topics relevant to cryptocurrency markets and regulatory developments
    - Include top positive/negative headlines with URLs and dates using consistent format
  expected_output: >
    A comprehensive risk assessment report for each of the top 10
    cryptocurrencies, highlighting potential risks and mitigation strategies.
    Include standardized risk scores (0-5 scale) with crypto-specific methodology.
    
    Also include a machine-readable JSON appendix containing:
    - risk_assessments[] matching the RiskAssessmentStandardized schema for each cryptocurrency
  agent: risk_assessor
  output_file: "output/crypto/crypto_risk_assessment.md"

investment_strategy_task:
  description: >
    Develop a comprehensive investment strategy for the top cryptocurrencies
    based on the technical analysis and risk assessment. Use the "Enhanced Crypto Analysis Tool"
    to generate detailed investment thesis and standardized risk assessments.
    
    Enhanced Analysis Requirements:
    - Use the "Enhanced Crypto Analysis Tool" for each cryptocurrency to generate:
      * Structured investment thesis bullets with market analysis
      * Standardized risk assessment on 0-5 scale (mapped from crypto 1-10 scale)
      * Market dynamics and tokenomics evaluation
    - Use the "Crypto Thesis Generator Tool" for additional thesis refinement
    - Apply the "Crypto Risk Scoring Tool" for consistent risk methodology
    
    Provide recommendations for asset allocation, position sizing, and clear
    investment thesis with proper risk-adjusted returns analysis.
  expected_output: >
    A detailed investment strategy document, including asset allocation, risk
    management, and a long-term outlook for the selected cryptocurrencies.
    Include standardized risk scores (0-5 scale) for each cryptocurrency.
    
    Also include a machine-readable JSON appendix containing:
    - crypto_theses[] matching the CryptoThesis schema for each cryptocurrency
    - risk_assessments[] matching the RiskAssessmentStandardized schema
  agent: investment_strategist
  output_file: "output/crypto/crypto_investment_strategy.md"

final_report_task:
  description: >
    Synthesize the findings from the market analysis, technical analysis, risk
    assessment, and investment strategy into a single, comprehensive
    investment report. The final report should be well-structured, easy to
    read, and provide a clear, actionable investment plan.
  expected_output: >
    A polished, final investment report that presents a crypto
    investment plan, complete with justifications, data, and clear next steps.
    The report should be formatted in HTML with emojis for better
    visualization.
  agent: research_director
  output_file: "output/crypto/crypto_final_report_en.html"

translation_task:
  description: >
    Translate the comprehensive English cryptocurrency investment report to French
    while preserving the exact HTML structure, CSS styling, emojis, and formatting.
    Maintain all technical financial terminology accuracy and professional tone.
    Do not modify the HTML structure, CSS classes, or visual elements - only translate
    the text content within HTML tags.
  expected_output: >
    A complete French translation of the cryptocurrency investment report with
    identical HTML structure, formatting, and visual elements. All financial
    terminology should be accurately translated while maintaining professional
    investment report standards.
  agent: translator
  output_file: "output/crypto/crypto_final_report_fr.html"
