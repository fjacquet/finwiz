# Export Generation Task
generate_export_task:
  description: >
    Consolidate all cryptocurrency analysis findings from context into a CryptoCrewExport object.
    
    CRITICAL: This is a FINAL REPORTER task - you have NO TOOLS. Use ONLY the context
    from previous tasks to extract all required information.
    
    CONTEXT SOURCES:
    - market_analysis_task: Market trends, thesis, and adoption analysis
    - technical_analysis_task: Technical indicators, price action, volatility
    - risk_assessment_task: Risk assessment and risk scores
    - investment_strategy_task: Investment strategy and recommendations
    - final_report_task: Consolidated findings
    
    REQUIRED FIELDS TO EXTRACT FROM CONTEXT:
    1. thesis (CryptoThesis):
       - Extract from market_analysis_task context
       - Include investment thesis, key points, adoption metrics
    
    2. risk_assessment (RiskAssessmentStandardized):
       - Extract from risk_assessment_task context
       - Include risk_score (0-5), risk_factors, systematic_risk, idiosyncratic_risk
    
    3. technical_analysis (dict):
       - Extract from technical_analysis_task context
       - Include price trends, support/resistance, momentum indicators
    
    4. composite_score (float 0.0-1.0):
       - Calculate based on all analysis dimensions
       - Weight: 30% thesis strength, 30% technical, 40% risk
       - Formula: (thesis_score * 0.3) + (technical_score * 0.3) + ((5 - risk_score) / 5 * 0.4)
    
    5. grade (A+ to F):
       - A+: composite_score >= 0.85
       - A: composite_score >= 0.75
       - B: composite_score >= 0.65
       - C: composite_score >= 0.55
       - D: composite_score >= 0.45
       - F: composite_score < 0.45
    
    6. volatility_30d (float):
       - Extract from technical_analysis_task context
       - 30-day annualized volatility
    
    7. max_drawdown (float):
       - Extract from technical_analysis_task context
       - Maximum drawdown (negative percentage)
    
    8. recommendation (BUY/HOLD/SELL):
       - BUY: grade >= B AND positive technical signals AND manageable risk
       - HOLD: grade = C OR mixed signals
       - SELL: grade <= D OR excessive risk
    
    9. confidence (float 0.0-1.0):
       - Based on data quality and consistency across analyses
       - High confidence (0.8-1.0): All analyses agree, strong signals
       - Medium confidence (0.5-0.8): Some disagreement, mixed signals
       - Low confidence (0.0-0.5): Conflicting analyses, weak signals
    
    10. rationale (string, min 50 chars):
        - Explain the recommendation based on all analysis findings
        - Reference specific metrics from thesis and technical analysis
        - Address volatility, adoption trends, and risk factors
        - Mention regulatory considerations and market positioning
    
    11. data_sources (list of strings):
        - List all data sources used: ["CoinMarketCap", "Kraken", "CoinGecko", etc.]
    
    12. report_html_path (string):
        - Set to: "output/reports/{session_id}/crypto_crew/{ticker}_report.html"
    
    13. report_json_path (string):
        - Set to: "output/reports/{session_id}/crypto_crew/{ticker}_export.json"
    
    METADATA FIELDS (auto-populated):
    - crew_name: "crypto_crew" (default)
    - ticker: From input parameter {ticker}
    - asset_class: "crypto" (default)
    - session_id: From input parameter {session_id}
    - analysis_date: Current timestamp (auto-generated)
    
    OUTPUT FORMAT:
    - Return a valid CryptoCrewExport Pydantic object
    - All fields must conform to schema validation
    - Use extra='forbid' - no additional fields allowed
    - Ensure all required fields are present
    
    VALIDATION:
    - composite_score must be between 0.0 and 1.0
    - grade must be one of: A+, A, B, C, D, F
    - recommendation must be one of: BUY, HOLD, SELL
    - confidence must be between 0.0 and 1.0
    - rationale must be at least 50 characters
    - volatility_30d must be >= 0.0
    - max_drawdown must be <= 0.0
    - All nested objects must conform to their schemas
    
    Today is {full_date}. Use this date for analysis_date if not auto-generated.
  expected_output: >
    A validated CryptoCrewExport Pydantic object containing all analysis findings,
    thesis, technical analysis, volatility metrics, scores, grades, and recommendations.
    The object will be automatically saved to JSON at the specified report_json_path.
  agent: investment_reporter
  output_pydantic: CryptoCrewExport
  async_execution: false
  depends_on:
    - final_report_task
