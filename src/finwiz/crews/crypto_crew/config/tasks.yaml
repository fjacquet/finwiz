market_analysis_task:
  description: >
    IMPORTANT: Today's date is {full_date}. Use this as your current date reference for all analysis.
    
    As an AI-driven cryptocurrency market analyst, use advanced reasoning to analyze current market 
    trends, sentiment, and news. Apply intelligent decision-making to identify the top 10 promising 
    cryptocurrencies with high growth potential.

    AI REASONING REQUIREMENTS:
    - Apply intelligent reasoning to interpret market data, trends, and sentiment
    - Provide clear AI-generated insights that go beyond simple data aggregation
    - Demonstrate understanding of crypto market dynamics, blockchain technology, and adoption patterns
    - Show adaptive thinking based on current market conditions as of {full_date}
    - Generate investment insights through AI reasoning, not just algorithmic screening
    
    CRITICAL DATE CONTEXT:
    - TODAY'S DATE IS {full_date} - Use this as your reference point for "current" market conditions
    - All analysis must reflect market conditions as of {full_date}, NOT historical dates
    - When searching or analyzing, use {full_date} as the current date context

    AI-DRIVEN ANALYSIS PROCESS:
    - Use AI reasoning to analyze cryptocurrency market trends and identify emerging opportunities
    - Apply intelligent interpretation of market sentiment, news, and social media signals
    - Generate insights on blockchain technology adoption and regulatory developments
    - Use reasoning to assess tokenomics, utility, and long-term viability
    - Apply AI decision-making to select cryptocurrencies with optimal risk-return profiles

    Validation Requirement:
    - For every proposed symbol, use the "Ticker Existence Validation Tool" (crypto path) to verify listing on Coinbase Products.
    - Auto-correct obvious symbol issues (case/typos); otherwise discard invalid ones.
    
    AI-Enhanced Sentiment Analysis:
    - Use the "Standardized Sentiment Analysis Tool" with intelligent interpretation
    - Apply AI reasoning to analyze sentiment patterns and their implications
    - Generate insights on sentiment-driven price movements and market psychology
    - Use AI to extract trending topics and assess their relevance to investment decisions
    - Provide AI-generated confidence intervals and uncertainty acknowledgments
    
    CRITICAL OUTPUT FORMAT:
    - Return ONLY the CryptoMarketAnalysis object directly - do NOT wrap it in additional fields
    - Do NOT add "data", "results", "analysis", or any wrapper fields
    - The JSON must match the CryptoMarketAnalysis schema exactly
    
    REQUIRED ENUM VALUES (use EXACTLY these values):
    - market_sentiment: MUST be one of: "bullish", "bearish", "neutral", "mixed" (lowercase, no other values allowed)
    
    OUTPUT: Return a structured JSON output conforming to the CryptoMarketAnalysis schema.
  expected_output: >
    A structured list of the top 10 promising cryptocurrencies conforming to the 
    CryptoMarketAnalysis Pydantic schema. Include analysis, validation status, and 
    crypto theses with initial thesis bullets.
    
    CRITICAL SCHEMA REQUIREMENTS:
    - Read docs/schemas/CryptoThesis.schema.json and docs/schemas/examples/crypto_thesis.example.json
    - Follow the exact schema structure shown in the example files
    - Ensure all required fields are included with correct data types
    - Return the object directly without wrapper fields
  agent: market_analyst
  output_pydantic: CryptoMarketAnalysis
  output_file: "output/crypto/crypto_market_analysis.json"
  async_execution: true

technical_analysis_task:
  description: >
    Conduct a detailed technical analysis of the cryptocurrencies identified by the market analyst. 
    Identify potential entry and exit points, support and resistance levels, and overall price trends 
    for the top 10 projects.
    
    Technical Indicators & Charts:
    - Use the "Twelve Data Indicator" tool to fetch RSI/MACD/Bollinger Bands for relevant intervals (if the symbol/interval is supported),
      and cite the parameters used.
    - Use the "Quantitative Analysis Tool" with analysis_type="technical" and asset_class="crypto" to perform
      comprehensive technical analysis including:
      * Multi-indicator confluence detection and signal strength scoring
      * Crypto-specific volatility analysis and momentum indicators
      * Support and resistance level identification with price targets
    - Generate charts with the "Chart-img Generator" tool and embed returned data URLs directly in the report.
    
    CRITICAL OUTPUT FORMAT:
    - Return ONLY the CryptoTechnicalAnalysis object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "results", "analysis", etc.
    - The JSON must match the CryptoTechnicalAnalysis schema exactly
    
    REQUIRED ENUM VALUES (use EXACTLY these values):
    - volume_trend: MUST be one of: "increasing", "decreasing", "stable" (lowercase)
    - trend_direction: MUST be one of: "bullish", "bearish", "neutral", "mixed" (lowercase)
    - trend_strength: MUST be one of: "strong", "moderate", "weak" (lowercase)
    - recommendation: MUST be one of: "BUY", "HOLD", "SELL" (uppercase)
    
    OUTPUT: Return a structured JSON output conforming to the CryptoTechnicalAnalysis schema.
  expected_output: >
    A structured technical analysis report for the top 10 cryptocurrencies conforming to 
    the CryptoTechnicalAnalysis Pydantic schema. Include chart patterns, key price levels, 
    technical indicators, and entry/exit points.
    
    IMPORTANT: Return the object directly without any wrapper fields.
  agent: technical_analyst
  output_pydantic: CryptoTechnicalAnalysis
  output_file: "output/crypto/crypto_technical_analysis.json"
  async_execution: true
  depends_on:
    - market_analysis_task

risk_assessment_task:
  description: >
    Evaluate the risks associated with the top 10 cryptocurrencies identified
    in previous tasks. Use the "Enhanced Crypto Analysis Tool" with risk assessment
    enabled to perform standardized crypto risk scoring.
    
    Enhanced Risk Assessment:
    - Use the "Enhanced Crypto Analysis Tool" for comprehensive risk analysis of each cryptocurrency
    - Apply the "Crypto Risk Scoring Tool" methodology for consistent 0-5 risk scores
    - Focus on crypto-specific risks: volatility, regulatory uncertainty, technology risks, market manipulation
    - Assess tokenomics, supply dynamics, and adoption risks
    - Use the "Quantitative Analysis Tool" with analysis_type="performance" and asset_class="crypto" to calculate:
      * Extreme volatility metrics and tail risk analysis (VaR/CVaR)
      * Correlation analysis with traditional assets and other cryptocurrencies
      * Drawdown analysis during crypto market crashes and recovery patterns
    
    Sentiment Analysis:
    - Use the "Standardized Sentiment Analysis Tool" with asset_class="crypto" for consistent sentiment methodology
    - Apply standardized cross-asset sentiment scoring with crypto-specific considerations
    - Extract trending topics relevant to cryptocurrency markets and regulatory developments
    - Include top positive/negative headlines with URLs and dates using consistent format
    
    CRITICAL OUTPUT FORMAT:
    - Return ONLY the CryptoRiskProfile object directly - do NOT wrap it in additional fields
    - Do NOT add "profiles", "metadata", "data", or any wrapper fields
    - The JSON must match the CryptoRiskProfile schema exactly with these top-level fields:
      schema_version, symbol, name, assessment_date, risk_assessment, volatility_risk,
      regulatory_risk, technology_risk, market_risk, adoption_risk, quantitative_risk_metrics,
      tokenomics_assessment, risk_mitigation_strategies, risk_summary
    - Example: {"schema_version": 1, "symbol": "BTC", "name": "Bitcoin", ...}
    
    REQUIRED ENUM VALUES (use EXACTLY these values):
    - risk_assessment.scale: MUST be one of: "0_5", "L_M_H", "L_M_H_VH" (use "0_5" for 0-5 scale)
    - risk_assessment.level: MUST be one of: "Low", "Medium", "High", "Very High" (capitalized, no other values)
    
    OUTPUT: Return a structured JSON output conforming to the CryptoRiskProfile schema.
  expected_output: >
    A structured comprehensive risk assessment report for each of the top 10 cryptocurrencies 
    conforming to the CryptoRiskProfile Pydantic schema. Include potential risks, mitigation 
    strategies, and standardized risk scores (0-5 scale) with crypto-specific methodology.
    
    IMPORTANT: Return the CryptoRiskProfile object directly without any wrapper fields.
  agent: risk_assessor
  output_pydantic: CryptoRiskProfile
  output_file: "output/crypto/crypto_risk_assessment.json"
  async_execution: true
  depends_on:
    - technical_analysis_task

investment_strategy_task:
  description: >
    Develop a comprehensive investment strategy for the top cryptocurrencies
    based on the technical analysis and risk assessment. Use the "Enhanced Crypto Analysis Tool"
    to generate detailed investment thesis and standardized risk assessments.
    
    Enhanced Analysis Requirements:
    - Use the "Enhanced Crypto Analysis Tool" for each cryptocurrency to generate:
      * Structured investment thesis bullets with market analysis
      * Standardized risk assessment on 0-5 scale (mapped from crypto 1-10 scale)
      * Market dynamics and tokenomics evaluation
    - Use the "Crypto Thesis Generator Tool" for additional thesis refinement
    - Apply the "Crypto Risk Scoring Tool" for consistent risk methodology
    - Use the "Quantitative Analysis Tool" with analysis_type="comprehensive" and asset_class="crypto" to generate:
      * Complete backtesting analysis with crypto-specific strategies
      * Performance attribution and risk-adjusted return calculations
      * Investment recommendations with quantitative justification and price targets
    
    Provide recommendations for asset allocation, position sizing, and clear
    investment thesis with proper risk-adjusted returns analysis.
    
    CRITICAL OUTPUT FORMAT:
    - Return ONLY the CryptoInvestmentStrategy object directly - do NOT wrap it in additional fields
    - Do NOT add wrapper fields like "data", "strategy", "recommendations", etc.
    - The JSON must match the CryptoInvestmentStrategy schema exactly
    
    REQUIRED ENUM VALUES (use EXACTLY these values):
    - time_horizon: MUST be one of: "short", "medium", "long" (lowercase)
    - recommendation: MUST be one of: "BUY", "HOLD", "SELL" (uppercase)
    - risk_assessment.scale: MUST be "0_5" (for 0-5 scale)
    - risk_assessment.level: MUST be one of: "Low", "Medium", "High", "Very High" (capitalized)
    
    OUTPUT: Return a structured JSON output conforming to the CryptoInvestmentStrategy schema.
  expected_output: >
    A structured detailed investment strategy document conforming to the CryptoInvestmentStrategy 
    Pydantic schema. Include asset allocation, risk management, long-term outlook, standardized 
    risk scores (0-5 scale), quantitative analysis results with backtesting performance, and 
    technical signals for each cryptocurrency.
    
    IMPORTANT: Return the object directly without any wrapper fields.
  agent: investment_strategist
  output_pydantic: CryptoInvestmentStrategy
  output_file: "output/crypto/crypto_investment_strategy.json"
  async_execution: true
  depends_on:
    - risk_assessment_task

final_report_task:
  description: >
    Synthesize the findings from the market analysis, technical analysis, risk
    assessment, and investment strategy into a single, comprehensive
    investment report. The final report should be well-structured, easy to
    read, and provide a clear, actionable investment plan.
  expected_output: >
    A polished, final investment report that presents a crypto
    investment plan, complete with justifications, data, and clear next steps.
    The report should be formatted in HTML with emojis for better
    visualization.
  agent: research_director
  output_file: "output/crypto/crypto_final_report_en.html"
  async_execution: false
  depends_on:
    - investment_strategy_task

translation_task:
  description: >
    Translate the comprehensive English cryptocurrency investment report to French
    while preserving the exact HTML structure, CSS styling, emojis, and formatting.
    Maintain all technical financial terminology accuracy and professional tone.
    Do not modify the HTML structure, CSS classes, or visual elements - only translate
    the text content within HTML tags.
  expected_output: >
    A complete French translation of the cryptocurrency investment report with
    identical HTML structure, formatting, and visual elements. All financial
    terminology should be accurately translated while maintaining professional
    investment report standards.
  agent: translator
  output_file: "output/crypto/crypto_final_report_fr.html"
  async_execution: false
  depends_on:
    - final_report_task
