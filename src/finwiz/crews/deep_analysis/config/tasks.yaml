# Deep Analysis Crew Tasks - Hybrid Python/AI Architecture
# Python calculates ALL metrics/scores. AI provides QUALITATIVE insights only.

deep_qualitative_analysis_task:
  description: >
    Qualitative analysis for {ticker} ({asset_class}).

    📅 DATE D'ANALYSE : {current_date} ({current_date_iso}).
    Tes données d'entraînement peuvent être périmées (l'entreprise a pu changer
    d'actionnariat, vendre/acquérir des filiales, changer de PDG depuis ton
    cutoff). Considère que la `Description` ci-dessous est la SEULE source de
    vérité sur la structure actuelle de l'entreprise. Tous tes constats doivent
    être cohérents avec la date {current_date}.

    LANGUE: Rédigez en FRANÇAIS. Noms de champs JSON en anglais, contenu en français.

    ---
    {fact_pack_block}

    Le FACT PACK est AUTORITAIRE pour les faits qu'il contient (structure
    corporate et direction pour une action, émetteur et frais pour un fonds,
    protocole et offre pour une crypto), ainsi que pour les événements
    récents. Tu ne dois JAMAIS le contredire. Si tes souvenirs divergent du
    FACT PACK, le FACT PACK gagne.
    ---

    CONTEXT (Python-calculated - DO NOT recalculate):
    - Company: {company_name} | Sector: {sector} | Industry: {industry}
    - Description: {company_description}
    - Grade: {grade}, Score: {composite_score}, Recommendation: {preliminary_recommendation}
    - Scores: Fundamental {fundamental_score}, Technical {technical_score}, Risk {risk_score}
    - Metrics: {fundamental_metrics}
    - Indicators: {technical_indicators}
    - Risk: {risk_metrics}

    🚨 ANTI-HALLUCINATION 🚨
    - Le FACT PACK ci-dessus est ta source PRIMAIRE pour les faits propres à
      la classe d'actif (structure corporate et direction pour une action,
      émetteur et frais pour un fonds, protocole et offre pour une crypto)
      ainsi que pour les événements récents (12 derniers mois). Le champ
      Description est secondaire.
    - N'invente JAMAIS de filiales, partenariats, ou intégrations non mentionnés
      dans le FACT PACK ou la `Description` ci-dessus.
    - Si tu te souviens d'une structure différente (acquisition, joint-venture,
      filiale) connue avant ton cutoff de formation et NON présente dans le
      FACT PACK ou la `Description`, considère-la comme OBSOLÈTE en {current_date} et ignore-la.
    - Quand tu cites des évolutions "récentes", elles doivent dater des 12 mois
      précédant {current_date}, pas d'années antérieures.

    🛠️ AUCUN OUTIL EXTERNE — tu n'as accès à aucun tool. Le FACT PACK
    ci-dessus est déjà le résultat de sources structurées vérifiées par
    Python avant cette tâche, donc toute vérification supplémentaire est
    redondante. Réponds directement à partir du FACT PACK et du CONTEXT
    fournis ; n'émets aucun appel d'outil.

    PROVIDE QUALITATIVE ANALYSIS ONLY:
    1. SEC Insights: Business model (100+ words), competitive advantages, risk factors
    2. Fundamental Context: Industry analysis (100+ words), growth drivers, positioning
    3. Technical Strategy: Chart patterns, support/resistance, entry/exit strategy
    4. Contextual Risks: Regulatory, geopolitical, competitive, operational
    5. Investment Synthesis: Thesis (200+ words), bull/base/bear cases (100+ words each),
       scenario probabilities as floats summing to 1.0, and a concrete action plan.

    🔒 CHAMPS PYTHON-CONTRÔLÉS — NE PAS INCLURE DANS TA SORTIE :
    Python alimente lui-même les champs suivants à partir de sources
    déterministes ; les inclure dans ta réponse n'a AUCUN effet et déclenche
    des cycles de validation inutiles :
    - `fact_pack` (et tous ses sous-champs : les faits propres à la classe
      d'actif affichés ci-dessus — structure/direction pour une action,
      émetteur/frais/lignes pour un fonds, protocole/offre pour une crypto —
      plus `fetched_at`, `freshness`, `confidence`, `source_citations`)
    - `analysis_timestamp`

    Le FACT PACK affiché en haut de ce prompt est en lecture seule pour toi —
    cite-le si nécessaire dans tes narratifs (sec_insights, fundamental_context,
    contextual_risks), mais ne le ré-émets PAS comme champ JSON.

    REQUIRED investment_synthesis structure (all fields mandatory):
    "investment_synthesis": {
      "investment_thesis": "...",
      "bull_case": "...",
      "base_case": "...",
      "bear_case": "...",
      "scenario_probabilities": {"bull": 0.30, "base": 0.50, "bear": 0.20},
      "final_recommendation": "BUY|HOLD|SELL",
      "recommendation_confidence": "LOW|MEDIUM|HIGH",
      "action_plan": {
        "immediate_actions": ["action 1", "action 2"],
        "monitoring_points": ["metric to watch 1", "metric to watch 2"],
        "exit_triggers": ["condition 1", "condition 2"]
      }
    }

    OUTPUT: Valid JSON matching QualitativeInsights schema.
    - ai_confidence: 0.0-1.0
    - analysis_timestamp: ISO 8601 format

    NO trailing commas. NO text outside JSON.

    {retry_guidance}

  expected_output: >
    QualitativeInsights JSON with sec_insights, fundamental_context,
    technical_strategy, contextual_risks, investment_synthesis.

  agent: asset_analyst

# NOTE: generate_enriched_analysis_task was REMOVED
# Python's synthesize_enriched_analysis() handles consolidation for $0
# This eliminates task-to-task context propagation that caused token overflow
