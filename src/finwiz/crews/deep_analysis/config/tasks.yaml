# ============================================================================
# DEEP ANALYSIS CREW - HYBRID PYTHON/AI ANALYSIS ARCHITECTURE
# ============================================================================
# This crew implements the hybrid approach for portfolio holdings analysis:
# - Python performs ALL deterministic calculations (scores, grades, metrics)
# - AI agent provides ONLY qualitative insights and contextual analysis
# - NO financial recalculations by AI - Python metrics are READ-ONLY context
#
# This crew is designed for SINGLE TICKER analysis of portfolio holdings.
# For discovery of new opportunities, use StockCrew, EtfCrew, or CryptoCrew.
# ============================================================================
#
# AVAILABLE CONTEXT VARIABLES:
# - {ticker}: Asset symbol (e.g., "AAPL", "VOO", "BTC-USD")
# - {company_name}: Full entity name (e.g., "Apple Inc.")
# - {asset_class}: Asset type ("stock", "etf", or "crypto")
# - {grade}: Python-calculated grade (A+, A, B, C, D, F)
# - {composite_score}: Python-calculated overall score (0.0-1.0)
# - {preliminary_recommendation}: Python recommendation (BUY/HOLD/SELL)
# - {fundamental_score}: Python fundamental analysis score (0.0-1.0)
# - {fundamental_metrics}: Dict with ROE, debt_to_equity, revenue_growth, etc.
# - {technical_score}: Python technical analysis score (0.0-1.0)
# - {technical_indicators}: Dict with RSI, MACD, SMA, momentum, etc.
# - {risk_score}: Python risk assessment score (0.0-1.0)
# - {risk_metrics}: Dict with volatility, beta, max_drawdown, etc.
# ============================================================================

deep_qualitative_analysis_task:
  description: >
    Perform comprehensive qualitative analysis for portfolio holding {ticker}.

    🇫🇷 LANGUE DE SORTIE: Toutes les analyses textuelles doivent être rédigées en FRANÇAIS.
    Les noms de champs JSON restent en anglais (business_model, etc.) mais leur CONTENU
    doit être en français. Exemple: "business_model": "Apple exploite un modèle d'affaires..."

    CRITICAL - CONTEXT PROVIDED (Do NOT recalculate):
    - Python has calculated ALL financial metrics, scores, and grades
    - Python grade: {grade}, composite score: {composite_score}
    - Python preliminary recommendation: {preliminary_recommendation}
    - Python fundamental score: {fundamental_score}
    - Python technical score: {technical_score}
    - Python risk score: {risk_score}
    - All detailed metrics: {fundamental_metrics}, {technical_indicators}, {risk_metrics}

    YOUR EXCLUSIVE FOCUS (Qualitative Analysis Only):

    1. SEC ANALYSIS (Business Insights)
       - Business model analysis and sustainability
       - Competitive advantages and moats
       - Risk factors from SEC filings
       - Strategic initiatives and direction
       - DO NOT recalculate financial metrics

    2. FUNDAMENTAL CONTEXT (Industry & Competition)
       - Industry trends and competitive landscape
       - Growth drivers and catalysts
       - Competitive positioning vs peers
       - Management quality and track record
       - DO NOT recalculate ROE, debt ratios, or growth rates

    3. TECHNICAL STRATEGY (Chart Patterns & Timing)
       - Chart patterns and formations
       - Support and resistance levels
       - Entry/exit strategy with price targets
       - Market timing and momentum assessment
       - DO NOT recalculate RSI, MACD, or other indicators

    4. CONTEXTUAL RISKS (Qualitative Risk Factors)
       - Regulatory and compliance risks
       - Geopolitical and macroeconomic risks
       - Competitive threats and market risks
       - Operational and execution risks
       - Stress test scenarios
       - DO NOT recalculate volatility, beta, or drawdown

    5. INVESTMENT SYNTHESIS (Strategic Guidance)
       - Comprehensive investment thesis (200+ words)
       - Bull/base/bear scenarios with probabilities
       - Final recommendation (refine Python preliminary)
       - Confidence assessment (LOW/MEDIUM/HIGH)
       - Actionable strategy (entry/exit, monitoring, triggers)
       - DO NOT recalculate composite score or grade

    PORTFOLIO CONTEXT:
    - This is a KEEP/SELL decision for an existing holding
    - Consider portfolio diversification and correlation
    - Assess whether holding still fits portfolio strategy
    - Recommend alternatives if suggesting SELL

    OUTPUT FORMAT SPECIFICATION (Requirement 12.7):
    Return a valid JSON object matching the QualitativeInsights schema exactly.

    REQUIRED FIELDS WITH DESCRIPTIONS:
    - sec_insights (object): SecAnalysisInsights with business_model (min 100 words), competitive_advantages (list), risk_factors (list), strategic_initiatives (list)
    - fundamental_context (object): FundamentalContextInsights with industry_analysis (min 100 words), growth_drivers (list), competitive_positioning (min 50 words), management_assessment (min 50 words)
    - technical_strategy (object): TechnicalStrategyInsights with chart_patterns (list), support_resistance (min 50 words), entry_exit_strategy (min 100 words), timing_assessment (min 50 words)
    - contextual_risks (object): ContextualRiskInsights with regulatory_risks (list), geopolitical_risks (list), competitive_risks (list), operational_risks (list), stress_scenarios (list)
    - investment_synthesis (object): InvestmentSynthesis with investment_thesis (min 200 words), bull_case (min 100 words), base_case (min 100 words), bear_case (min 100 words), scenario_probabilities (dict), final_recommendation (BUY/HOLD/SELL), recommendation_confidence (LOW/MEDIUM/HIGH), action_plan (dict with 3 keys)
    - analysis_timestamp (string): ISO 8601 format datetime (e.g., "2025-01-22T10:30:00Z")
    - ai_confidence (float): Between 0.0 and 1.0

    PYDANTIC SCHEMA REFERENCE:
    Your output MUST match this exact Pydantic structure:

    class SecAnalysisInsights:
        business_model: str (min 100 chars)
        competitive_advantages: list[str] (min 1 item)
        risk_factors: list[str] (min 1 item)
        strategic_initiatives: list[str]

    class FundamentalContextInsights:
        industry_analysis: str (min 100 chars)
        growth_drivers: list[str] (min 1 item)
        competitive_positioning: str (min 50 chars)
        management_assessment: str (min 50 chars)

    class TechnicalStrategyInsights:
        chart_patterns: list[str] (min 1 item)
        support_resistance: str (min 50 chars)
        entry_exit_strategy: str (min 100 chars)
        timing_assessment: str (min 50 chars)

    class ContextualRiskInsights:
        regulatory_risks: list[str]
        geopolitical_risks: list[str]
        competitive_risks: list[str]
        operational_risks: list[str]
        stress_scenarios: list[str]

    class ScenarioProbabilities:
        bull: float (0.0-1.0)
        base: float (0.0-1.0)
        bear: float (0.0-1.0)

    class ActionPlan:
        immediate_actions: list[str]
        monitoring_points: list[str]
        exit_triggers: list[str]

    class InvestmentSynthesis:
        investment_thesis: str (min 200 chars)
        bull_case: str (min 100 chars)
        base_case: str (min 100 chars)
        bear_case: str (min 100 chars)
        scenario_probabilities: ScenarioProbabilities (bull + base + bear must sum to 1.0)
        final_recommendation: str (MUST be "BUY", "HOLD", or "SELL")
        recommendation_confidence: str (MUST be "LOW", "MEDIUM", or "HIGH")
        action_plan: ActionPlan

    class QualitativeInsights (ROOT):
        sec_insights: SecAnalysisInsights
        fundamental_context: FundamentalContextInsights
        technical_strategy: TechnicalStrategyInsights
        contextual_risks: ContextualRiskInsights
        investment_synthesis: InvestmentSynthesis
        analysis_timestamp: str (ISO 8601)
        ai_confidence: float (0.0-1.0)

    EXAMPLE OUTPUT (Requirement 12.7) - CONTENU EN FRANÇAIS:
    {{
      "sec_insights": {{
        "business_model": "L'entreprise exploite un modèle d'affaires hautement intégré axé sur la conception, la fabrication et la vente d'électronique grand public... (minimum 100 mots EN FRANÇAIS)",
        "competitive_advantages": ["Fidélité à la marque et verrouillage de l'écosystème", "Intégration verticale", "Pouvoir de fixation des prix premium"],
        "risk_factors": ["Surveillance réglementaire sur les marchés européens", "Concentration de la chaîne d'approvisionnement", "Saturation du marché"],
        "strategic_initiatives": ["Expansion des services", "Diversification géographique", "Intégration de l'IA"]
      }},
      "fundamental_context": {{
        "industry_analysis": "L'industrie technologique traverse une phase de maturation avec des taux de croissance ralentissant... (minimum 100 mots EN FRANÇAIS)",
        "growth_drivers": ["Pénétration des marchés émergents", "Innovation produit", "Gains de parts de marché"],
        "competitive_positioning": "Leader du marché avec plus de 50% des profits du segment premium... (minimum 50 mots EN FRANÇAIS)",
        "management_assessment": "Excellente allocation de capital et innovation démontrées par la direction... (minimum 50 mots EN FRANÇAIS)"
      }},
      "technical_strategy": {{
        "chart_patterns": ["Triangle ascendant", "Croisement doré des MM 50/200"],
        "support_resistance": "Supports clés à 170$, 165$, 160$. Résistances à 185$, 190$, 200$... (minimum 50 mots EN FRANÇAIS)",
        "entry_exit_strategy": "Entrée sur repli vers 172-175$ avec confirmation des volumes. Prise de profits à 190$, stop suiveur à 8%... (minimum 100 mots EN FRANÇAIS)",
        "timing_assessment": "Les indicateurs de momentum suggèrent un timing d'entrée favorable... (minimum 50 mots EN FRANÇAIS)"
      }},
      "contextual_risks": {{
        "regulatory_risks": ["Conformité au DMA européen", "Enquêtes antitrust américaines"],
        "geopolitical_risks": ["Tensions Chine-États-Unis", "Risque chaîne d'approvisionnement Taiwan"],
        "competitive_risks": ["Concurrence Android", "Érosion des parts de marché"],
        "operational_risks": ["Concentration des fournisseurs", "Retards de lancement produit"],
        "stress_scenarios": ["Amendes réglementaires impactant les marges", "Baisse des ventes Chine de 30%"]
      }},
      "investment_synthesis": {{
        "investment_thesis": "Cette thèse d'investissement complète combine l'analyse fondamentale et technique... (minimum 200 mots EN FRANÇAIS)",
        "bull_case": "Les services accélèrent à 30% du chiffre d'affaires, le Vision Pro réussit... (minimum 100 mots EN FRANÇAIS)",
        "base_case": "Cycle de remplacement iPhone stable, services en croissance de 15% par an... (minimum 100 mots EN FRANÇAIS)",
        "bear_case": "Demande iPhone faiblit, amendes réglementaires impactent les marges... (minimum 100 mots EN FRANÇAIS)",
        "scenario_probabilities": {{"bull": 0.25, "base": 0.50, "bear": 0.25}},
        "final_recommendation": "BUY",
        "recommendation_confidence": "HIGH",
        "action_plan": {{
          "immediate_actions": ["Accumuler sur les replis vers 172-175$", "Placer un stop initial à 168$"],
          "monitoring_points": ["Résultats Q1 pour la croissance des services", "Évolutions réglementaires"],
          "exit_triggers": ["Cassure sous 165$", "Détérioration fondamentale"]
        }}
      }},
      "analysis_timestamp": "2025-01-22T10:30:00Z",
      "ai_confidence": 0.85
    }}

    CRITICAL JSON SYNTAX:
    - Notice NO trailing comma after last item in arrays: ["item1", "item2"]  ✅
    - Notice NO trailing comma after last object property: "key": "value"  ✅
    - Invalid examples to AVOID: ["item1", "item2",]  ❌  or {{"key": "value",}}  ❌

    VALIDATION REQUIREMENTS (Requirement 12.1-12.6):
    - Output MUST be ONLY valid JSON - no explanatory text before or after
    - Your ENTIRE response must be a single JSON object starting with {{ and ending with }}
    - Do NOT include any text, comments, or explanations outside the JSON
    - Do NOT return tool_calls or function_call keys
    - All required fields MUST be present with correct types
    - CRITICAL: NO trailing commas in JSON - last item in arrays/objects must NOT have comma
    - Ensure valid JSON syntax - use online JSON validator if needed
    - Text fields MUST meet minimum word counts:
      * business_model >= 100 words
      * industry_analysis >= 100 words
      * competitive_positioning >= 50 words
      * management_assessment >= 50 words
      * support_resistance >= 50 words
      * entry_exit_strategy >= 100 words
      * timing_assessment >= 50 words
      * investment_thesis >= 200 words
      * bull_case >= 100 words
      * base_case >= 100 words
      * bear_case >= 100 words
    - List fields MUST contain at least 1 item:
      * competitive_advantages, risk_factors, growth_drivers, chart_patterns
    - scenario_probabilities MUST sum to 1.0 (e.g., {{"bull": 0.25, "base": 0.50, "bear": 0.25}})
    - final_recommendation MUST be exactly "BUY", "HOLD", or "SELL" (uppercase)
    - recommendation_confidence MUST be exactly "LOW", "MEDIUM", or "HIGH" (uppercase)
    - action_plan MUST contain exactly three keys: "immediate_actions", "monitoring_points", "exit_triggers"
    - Each action_plan key must contain a list of strings (minimum 1 item per list)
    - analysis_timestamp MUST be valid ISO 8601 format (e.g., "2025-01-22T10:30:00Z")
    - ai_confidence MUST be between 0.0 and 1.0
    - If output fails validation, system will retry with explicit format instructions (Requirement 12.3)
    - After 2 failed attempts, fallback to Python-only analysis (Requirement 12.4)

  expected_output: >
    QualitativeInsights Pydantic object containing:
    - sec_insights: Business model (100+ words), competitive advantages (1+ items), risks (1+ items), strategic initiatives
    - fundamental_context: Industry analysis (100+ words), growth drivers (1+ items), competitive positioning (50+ words), management (50+ words)
    - technical_strategy: Chart patterns (1+ items), support/resistance (50+ words), entry/exit strategy (100+ words), timing (50+ words)
    - contextual_risks: Regulatory, geopolitical, competitive, operational risks, stress scenarios
    - investment_synthesis: Investment thesis (200+ words), bull/base/bear cases (100+ words each), scenario probabilities (sum=1.0), recommendation (BUY/HOLD/SELL), confidence (LOW/MEDIUM/HIGH), action plan (3 keys)
    - analysis_timestamp: ISO 8601 format datetime
    - ai_confidence: Float between 0.0 and 1.0

  agent: asset_analyst
  async_execution: true

generate_enriched_analysis_task:
  description: >
    Consolidate Python metrics and AI insights into EnrichedAnalysis for {ticker}.

    CRITICAL: This is a FINAL REPORTER task - you have NO TOOLS.
    Use ONLY the context from previous tasks.

    CONTEXT SOURCES:
    - Python quantitative analysis: QuantitativeAnalysis object with all scores/metrics
    - deep_qualitative_analysis_task: QualitativeInsights with all AI analysis

    CONSOLIDATION PROCESS:
    1. Extract QuantitativeAnalysis from context (Python-calculated)
       - composite_score, fundamental_score, technical_score, risk_score
       - grade, preliminary_recommendation
       - All detailed metrics (fundamental, technical, risk)
       - Data quality and lineage metadata

    2. Extract QualitativeInsights from deep_qualitative_analysis_task
       - sec_insights (business model, competitive advantages, risks)
       - fundamental_context (industry, growth drivers, positioning)
       - technical_strategy (patterns, support/resistance, entry/exit)
       - contextual_risks (regulatory, geopolitical, competitive, operational)
       - investment_synthesis (thesis, scenarios, recommendation, action plan)

    3. Create EnrichedAnalysis combining both:
       - ticker: {ticker}
       - company_name: {company_name}
       - asset_class: {asset_class}
       - analysis_date: Current timestamp
       - quantitative: QuantitativeAnalysis (from Python)
       - qualitative: QualitativeInsights (from AI)
       - final_grade: Use Python grade
       - final_score: Use Python composite_score
       - final_recommendation: Use AI-refined recommendation from synthesis
       - recommendation_confidence: Use AI confidence from synthesis
       - executive_summary: Generate from investment thesis (200+ words)
       - investment_rationale: Use investment thesis from synthesis (500+ words)
       - report_word_count: Calculate from all text content
       - unique_insights_count: Count unique insights from AI analysis
       - processing_time_seconds: Calculate from timestamps
       - llm_cost_dollars: Estimate from LLM calls

    VALIDATION REQUIREMENTS:
    - report_word_count MUST be >= 2000 words
    - unique_insights_count MUST be >= 5 insights
    - executive_summary MUST be >= 200 words
    - investment_rationale MUST be >= 500 words
    - All required fields must be present
    - Schema compliance must be validated

    QUALITY CHECKS:
    - Verify Python metrics are preserved (not recalculated)
    - Verify AI insights are comprehensive
    - Verify recommendation is well-justified
    - Verify action plan is actionable
    - Verify word count and insights thresholds are met

  expected_output: >
    EnrichedAnalysis Pydantic object containing:
    - Complete Python quantitative analysis (READ-ONLY from context)
    - Complete AI qualitative insights (from deep_qualitative_analysis_task)
    - Final synthesized recommendation and confidence
    - Executive summary (>= 200 words) and investment rationale (>= 500 words)
    - Quality metrics (word count >= 2000, insights >= 5)
    - Processing metadata (time, cost)
    - All validation requirements met

  agent: investment_reporter
  async_execution: false # Final task must be synchronous
  depends_on:
    - deep_qualitative_analysis_task
