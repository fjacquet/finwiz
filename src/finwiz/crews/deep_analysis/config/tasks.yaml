# ============================================================================
# SIMPLIFIED DEEP ANALYSIS CREW - PYTHON SCORING APPROACH
# ============================================================================
# This configuration implements the Python scoring approach with only 2 tasks:
# 1. data_collection_task (async) - Fetch all required data
# 2. python_scoring_task (sync) - Call DeepAnalysisScorer for calculations
#
# REMOVED TASKS (replaced by Python scoring):
# - deep_analysis_task (AI reasoning replaced by Python calculations)
# - technical_analysis_task (AI reasoning replaced by Python calculations)  
# - risk_assessment_task (AI reasoning replaced by Python calculations)
# - final_report_task (AI reasoning replaced by Python template)
# - generate_export_task (AI reasoning replaced by Python data consolidation)
#
# PERFORMANCE TARGETS:
# - Execution time: 10-30 seconds (vs 5-10 minutes with AI)
# - LLM calls: 0 for calculations (vs 15-25 with AI)
# - Cost: $0 for calculations (vs $0.05-0.10 with AI)
# ============================================================================

data_collection_task:
  description: >
    ⚡ DATA COLLECTION: Gather ALL required data for ticker {ticker}

    CRITICAL: SINGLE TICKER MODE - Collect data ONLY for {ticker} of asset class {asset_class}
    You are a data collection specialist - NO analysis, NO scoring, just efficient data gathering.

    🚨 CRITICAL TOOL USAGE RULES 🚨
    - ALWAYS call tools with simple parameters: tool(ticker="{ticker}")
    - NEVER pass JSON arrays or objects to tools
    - Call tools ONE AT A TIME for the single ticker {ticker}
    - NEVER ask for user input or clarification

    DATA TO COLLECT for {ticker}:
    1. Price data (current price, historical prices)
    2. Fundamental metrics:
       - For STOCKS: ROE, debt-to-equity, revenue growth, profit margins
       - For ETFs: expense ratio, tracking error, AUM, holdings
       - For CRYPTO: market cap, volume, age, tokenomics
    3. Technical indicators: RSI, MACD, support/resistance levels
    4. Risk metrics: volatility, beta, max drawdown
    5. Sentiment data: news sentiment, social media trends

    STORAGE FORMAT:
    Store all collected data in structured context for Python scoring:
    context["collected_data"] = {{
      "ticker": "{ticker}",
      "asset_class": "{asset_class}",
      "collection_timestamp": current_timestamp,
      "price_data": {{...}},
      "fundamentals": {{...}},
      "technical_indicators": {{...}},
      "risk_metrics": {{...}},
      "sentiment": {{...}}
    }}

    CRITICAL OUTPUT REQUIREMENT:
    Output the collected data as a JSON structure that the orchestrator can parse.
    Use this format EXACTLY:

    {{
      "ticker": "{ticker}",
      "asset_class": "{asset_class}",
      "current_price": <number>,
      "roe": <number or null>,
      "debt_to_equity": <number or null>,
      "volatility": <number or null>,
      "beta": <number or null>,
      "rsi": <number or null>,
      "macd": <number or null>,
      ... (all collected metrics)
    }}
  expected_output: >
    JSON structure containing ALL collected data for ticker {ticker}:
    - Price data with current and historical prices
    - Fundamental metrics (asset-class specific)
    - Technical indicators (RSI, MACD, trends)
    - Risk metrics (volatility, beta, drawdown)
    - Sentiment data and news analysis
    - Collection timestamp for freshness tracking
  agent: asset_analyst
  async_execution: false  # Sync for sequential data collection

python_scoring_task:
  description: >
    CRITICAL: SINGLE TICKER MODE - Calculate scores for ticker: {ticker}

    As a Python scoring specialist, call the Deep Analysis Scorer tool to calculate
    all scores, grades, and recommendations for the single ticker {ticker} of asset
    class {asset_class}. This tool executes REAL Python code for deterministic calculations.

    🔧 TOOL USAGE - Call Deep Analysis Scorer tool 🔧
    You have access to the "Deep Analysis Scorer" tool which executes Python scoring.

    CRITICAL INSTRUCTIONS:
    1. Extract the collected data from data_collection_task context
    2. Call the "Deep Analysis Scorer" tool ONCE with these parameters:
       - ticker: "{ticker}"
       - asset_class: "{asset_class}"
       - current_price: (extract from collected data)
       - For STOCKS: roe, debt_to_equity, revenue_growth, profit_margin
       - For ETFs: expense_ratio, tracking_error, aum
       - For CRYPTO: market_cap, volume_24h, age_years
       - Risk metrics: volatility, beta, max_drawdown
       - Technical: rsi, macd
    3. The tool will return JSON with grade, score, and recommendation
    4. Return the tool's output as your final result

    PARAMETER EXTRACTION GUIDE:
    - Extract numeric values from collected data (remove units like "USD", "billion")
    - Convert strings to numbers: "850 billion USD" → 850000000000.0
    - Map field names: "volume" → "volume_24h" for crypto
    - Ensure all critical fields are present before calling tool

    CRITICAL: PRESERVE ALL DATA (Requirements 18.21-18.25)
    Ensure ALL raw data is preserved in the final export:
    - Raw metrics: volatility, beta, ROE, debt/equity, RSI, MACD, etc.
    - Sentiment data: sentiment_score, trending_topics, article_count
    - Technical indicators: support/resistance, trend direction
    - Fundamental data: revenue, earnings, cash flow
    - Calculation results: composite score, grade, recommendation, risk score
    - Template-based rationale text (generated by DeepAnalysisScorer)

    SCORING COMPONENTS (handled by DeepAnalysisScorer):
    - Fundamental Score (40%): ROE, debt, growth, margins (stocks) / expense ratio, tracking error (ETFs) / market cap, volume (crypto)
    - Technical Score (30%): RSI, trend analysis, MACD momentum
    - Risk Score (30%): Volatility, max drawdown, beta (converted to 0-1 scale where 1=low risk)
    - Composite Score: Weighted average of above components
    - Grade: A+ (≥0.95), A (≥0.85), B+ (≥0.80), B (≥0.75), C+ (≥0.70), C (≥0.65), D (≥0.50), F (<0.50)
    - Recommendation: BUY (≥0.85), HOLD (0.65-0.85), SELL (<0.65)

    PERFORMANCE TARGETS (Requirements 18.28-18.30):
    - Execution time: 10-30 seconds (vs 5-10 minutes with AI)
    - LLM calls: 0 for calculations (vs 15-25 with AI)
    - Cost: $0 for calculations (vs $0.05-0.10 with AI)
    - Speedup: 10-20x faster than AI approach
    - Cost reduction: 100% for calculations

    CONTEXT STORAGE FORMAT:
    Store scoring results in context:
    context["scoring_results"] = {{
        "ticker": "{ticker}",
        "asset_class": "{asset_class}",
        "scoring_timestamp": "2025-01-25T10:30:00Z",
        "deep_analysis_result": DeepAnalysisResult object,
        "crew_export": DeepAnalysisCrewExport object,
        "performance_metrics": {{
            "execution_time_seconds": float,
            "llm_calls_count": 0,
            "calculation_cost_usd": 0.0
        }}
    }}
  expected_output: >
    Python scoring results for ticker {ticker} including:
    - DeepAnalysisResult with all component scores and details
    - DeepAnalysisCrewExport ready for JSON serialization
    - Composite score (0.0-1.0) and letter grade (A+ to F)
    - Investment recommendation (BUY/HOLD/SELL) with confidence
    - Template-based rationale explaining the recommendation
    - All raw data preserved from data collection
    - Performance metrics (execution time, LLM calls=0, cost=$0)
  agent: investment_reporter
  async_execution: false  # ❌ Must be synchronous: Final task requirement
  depends_on:
    - data_collection_task

# Optional AI Summary Task (Hybrid Approach)
ai_summary_task:
  description: >
    OPTIONAL: Generate AI prose summary for ticker: {ticker} (HYBRID APPROACH)
    
    This task is ONLY executed when DEEP_ANALYSIS_AI_SUMMARY=true environment variable is set.
    It provides a hybrid approach: Python scoring (fast, cheap) + optional AI summary (prose).

    🚨 HYBRID APPROACH RULES 🚨
    - Python scoring MUST complete first (python_scoring_task)
    - This task adds AI-generated prose summary AFTER Python calculations
    - Use context from python_scoring_task for all scores and data
    - NEVER recalculate scores - only generate prose summary

    PERFORMANCE TARGETS (Requirements 18.31-18.36):
    - Total time: 15-40 seconds (Python scoring 10-30s + AI summary 5-10s)
    - Cost: $0.01 per ticker (only for AI summary, not calculations)
    - Cost savings: 80-90% vs full AI approach ($0.01 vs $0.05-0.10)
    - Speedup: Still 8-15x faster than full AI approach

    AI SUMMARY PROCESS:
    1. Extract scoring results from python_scoring_task context
    2. Extract detailed_analysis from python_scoring_task context
    3. Generate professional prose summary using AI reasoning
    4. Enhance rationale with AI-generated insights
    5. Create narrative explanation of the Python-calculated scores
    6. Store enhanced summary in context for potential downstream use

    CRITICAL: NO RECALCULATION
    - Do NOT recalculate any scores, grades, or recommendations
    - Use ONLY the Python-calculated values from context
    - Focus on generating compelling prose explanation
    - Add market context and qualitative insights
    - Enhance the template-based rationale with AI narrative

    OUTPUT REQUIREMENTS:
    - Enhanced rationale with AI-generated prose
    - Market context and qualitative insights
    - Professional investment narrative
    - Clear explanation of Python-calculated scores
    - French language for user-facing content
  expected_output: >
    AI-enhanced summary for ticker {ticker} including:
    - Professional prose summary of Python-calculated results
    - Enhanced rationale with market context and insights
    - Qualitative analysis complementing quantitative scores
    - Clear narrative explanation of recommendation
    - All based on Python-calculated scores (no recalculation)
  agent: investment_reporter
  async_execution: false  # ❌ Must be synchronous: Optional final enhancement
  depends_on:
    - python_scoring_task
