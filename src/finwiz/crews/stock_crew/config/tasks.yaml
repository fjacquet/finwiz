# Market Analysis Tasks
market_technical_analysis_task:
  description: >
    Define the market and technical analysis task.

    This task involves researching stock market trends and conducting in-depth
    financial analysis of companies, focusing on identifying promising stocks
    and evaluating their fundamentals, valuation, and growth prospects.

    Research and identify current market trends in established sectors of the
    stock market. Focus on stable, blue-chip companies with strong
    fundamentals and consistent performance.

    1. Identify key market trends and growth sectors as of {full_date}.
    2. Analyze current market sentiment and adoption potential.
    3. Examine historical patterns indicating growth potential, considering the present market context as of {full_date}.

    OUTPUT: Return a concise analysis of market trends, ensuring all information is current as of {full_date}.
  expected_output: >
    An analysis of current stock market trends and emerging sectors with
    growth potential.
  agent: market_technical_analyst
  output_file: "output/stock/stock_market_trends.md"

# Technical Analysis Tasks
stock_screening_task:
  description: >
    Screen and identify the top 10 stable, blue-chip stocks with strong
    fundamentals. Focus on companies with consistent earnings, solid balance
    sheets, and proven track records of performance.

    1. Screen stocks using stability and value metrics 
    2. Evaluate financial fundamentals and dividend history 
    3. Assess management teams and corporate governance 
    4. Select the top 10 stocks with lowest risk profiles
    5. Validate each proposed ticker using the "Ticker Existence Validation Tool":
       - For equities/ETFs use Yahoo Finance existence and quoteType
       - For crypto proposals (if any), validate via Coinbase Products API
       - Auto-correct obvious symbol issues (case/typos); otherwise discard invalid ones
    6. Sentiment analysis: Use the "Standardized Sentiment Analysis Tool" for consistent sentiment methodology.
       - Analyze recent headlines/snippets (last 30–90 days) for each candidate
       - Classify sentiment with weighted scoring and confidence intervals
       - Provide aggregate metrics: mean score, weighted score, counts per label
       - Extract trending topics with relevance scoring
       - Include top 3 positive/negative headlines with source URLs and dates
       - Use standardized cross-asset sentiment methodology for consistency

    Today is {full_date}. Ensure your analysis reflects current market
    conditions. IMPORTANT: Use only real, existing stocks with accurate ticker
    symbols.

    OUTPUT: Return a list of the top 10 emerging stocks with analysis.
  expected_output: >
    A list of 10 emerging stocks with  potential, including ticker
    symbols and analysis. Include a concise "Market Sentiment" summary per ticker
    with aggregate metrics and cited headlines.
    Also include machine-readable JSON appendices at the end containing:
    - stock_sentiments[] matching the MarketSentiment schema (one per ticker)
    - validated_tickers[] where each item is {symbol, asset_class, valid, reason, meta}
  agent: market_technical_analyst
  output_file: "output/stock/emerging_stocks_analysis.md"

# Technical Detail Tasks
technical_detail_task:
  description: >
    Perform detailed technical analysis on each of the 10 selected stocks.

    1. Analyze financial fundamentals for each stock using the latest available data as of {full_date}.
    2. Assess growth scalability and efficiency metrics based on recent performance.
    3. Evaluate balance sheet strength and risk factors as of {full_date}.
    4. Examine competitive advantages and innovation potential, considering any recent developments.
    5. 10-K extraction: Use the "Enhanced SEC Analysis Tool" to extract comprehensive insights from the most recent 10-K filing for each ticker.
       - Extract detailed, cited excerpts from Business Overview (Item 1), Risk Factors (Item 1A), MD&A (Item 7), and Market Risk Disclosures (Item 7A).
       - Include SEC filing URL, specific section references, filing date, and standardized risk assessment.
       - Provide structured TenKInsight objects with proper citations and provenance.
       - Summarize material year-over-year changes relevant to the current analysis as of {full_date}.
    6. Technical indicators: Use the "Twelve Data Indicator" tool to fetch RSI/MACD/Bollinger Bands
       for relevant intervals per ticker, referencing exact parameters used.
    7. Charts: Generate visual charts with the "Chart-img Generator" tool and embed returned data URLs in the report.

    Ensure your analysis reflects the company's status as of {full_date}.
  expected_output: >
    Technical assessment in markdown of each stock including financial metrics
    and analysis. Include a "10-K Insights" subsection with cited excerpts and
    the SEC filing URL and date.
    Also include a machine-readable JSON appendix at the end containing:
    - ten_k_insights[] matching the TenKInsight schema with enhanced SEC citations
    - risk_assessments[] matching the RiskAssessmentStandardized schema for each ticker
  agent: market_technical_analyst
  output_file: "output/stock/stock_technical_details.md"
  depends_on:
    - stock_screening_task

# Risk Analysis Tasks
stock_risk_assessment_task:
  description: >
    Evaluate risks for each of the 10 stocks identified in previous tasks.

    1. Use the "Enhanced SEC Analysis Tool" to extract comprehensive risk factors from 10-K filings for standardized risk assessment.
    2. Assess regulatory challenges and compliance status in major markets, relevant for {current_year}.
    3. Identify financial stability and debt structure risks based on data as of {full_date}.
    4. Analyze valuation risks (P/E ratio, revenue concentration, growth sustainability) using current market data as of {full_date}.
    5. Evaluate competitive threats and market positioning as of {full_date}.
    6. Review management and corporate governance risks based on the latest information.
    7. Apply the "Standardized Risk Scoring Tool" methodology to generate consistent 0-5 risk scores with proper level mapping.
    8. Market sentiment: Use the "Standardized Sentiment Analysis Tool" for consistent sentiment analysis.
       - Analyze recent headlines/snippets with standardized methodology
       - Provide weighted sentiment scores and confidence intervals
       - Include sentiment distribution (Positive/Neutral/Negative counts)
       - Extract trending topics relevant to each ticker
       - List top 3 positive and top 3 negative headlines with source URLs and dates
       - Use consistent cross-asset sentiment scoring for comparability

    Follow the output instructions in docs/output_formatting_guide.md.
  expected_output: >
    A detailed risk profile for each stock covering regulatory, financial,
    valuation, competitive, and governance risks. Include standardized risk scores
    (0-5 scale) with consistent methodology. Include a "Market Sentiment"
    subsection per ticker with aggregates and cited examples.
    The report should be formatted in HTML with emojis for better
    visualization.
    Also include a machine-readable JSON appendix containing:
    - risk_assessments[] matching the RiskAssessmentStandardized schema for each ticker
  agent: investment_risk_analyst
  output_file: "output/stock/stock_investment_risk_strategy_en.html"
  depends_on:
    - technical_detail_task

translation_task:
  description: >
    Translate the comprehensive English stock investment report to French
    while preserving the exact HTML structure, CSS styling, emojis, and formatting.
    Maintain all technical financial terminology accuracy and professional tone.
    Do not modify the HTML structure, CSS classes, or visual elements - only translate
    the text content within HTML tags.
  expected_output: >
    A complete French translation of the stock investment report with
    identical HTML structure, formatting, and visual elements. All financial
    terminology should be accurately translated while maintaining professional
    investment report standards.
  agent: translator
  output_file: "output/stock/stock_investment_risk_strategy_fr.html"

