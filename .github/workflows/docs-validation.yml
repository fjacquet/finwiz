name: Documentation Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          if [ -f .markdownlint.jsonc ]; then
            markdownlint --config .markdownlint.jsonc docs/
          else
            markdownlint docs/
          fi
        continue-on-error: true

      - name: Check for broken internal links
        run: |
          echo "Checking for broken internal links..."
          cd docs
          broken_links=0

          # Find all markdown files and check for broken relative links
          for file in $(find . -name "*.md"); do
            echo "Checking $file"

            # Extract markdown links
            grep -oP '\[.*?\]\(\K[^)]+(?=\))' "$file" | while read link; do
              # Skip external links and anchors
              if [[ "$link" =~ ^https?:// ]] || [[ "$link" =~ ^# ]]; then
                continue
              fi

              # Get the directory of the current file
              dir=$(dirname "$file")

              # Resolve the link path
              target="$dir/$link"

              # Check if target file exists
              if [ ! -f "$target" ]; then
                echo "  ❌ Broken link in $file: $link -> $target"
                broken_links=$((broken_links + 1))
              fi
            done
          done

          if [ $broken_links -gt 0 ]; then
            echo "Found $broken_links broken link(s)"
            exit 1
          fi

          echo "✅ No broken internal links found"

      - name: Validate documentation structure
        run: |
          echo "Validating documentation structure..."

          # Check required files exist
          required_files=(
            "docs/index.md"
            "docs/README.md"
            "docs/DEVELOPER_GUIDE.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Required file missing: $file"
              exit 1
            fi
          done

          # Check required directories exist
          required_dirs=(
            "docs/tutorials"
            "docs/how-to"
            "docs/reference"
            "docs/explanations"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Required directory missing: $dir"
              exit 1
            fi
          done

          echo "✅ Documentation structure is valid"

      - name: Check for MkDocs artifacts
        run: |
          echo "Checking for leftover MkDocs artifacts..."

          if [ -f "mkdocs.yml" ]; then
            echo "❌ Found mkdocs.yml - should be removed"
            exit 1
          fi

          if find docs -name ".pages" -type f | grep -q .; then
            echo "❌ Found .pages files - should be removed"
            exit 1
          fi

          echo "✅ No MkDocs artifacts found"
