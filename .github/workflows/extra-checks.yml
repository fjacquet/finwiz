name: Extra checks
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
concurrency:
  group: extra-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: fjacquet/ci/actions/setup-uv@v1 # nosemgrep: github-actions.security.third-party-action-not-pinned-to-commit-sha
        with: { python-version: "3.12" }
      - run: uv sync --all-extras --all-groups
      - run: uvx vulture src/finwiz --min-confidence 80
      - run: uvx pylint --disable=all --enable=duplicate-code --min-similarity-lines=37 --score=no src/finwiz
      - run: make check-unittest-mock
      - run: make check-file-size
