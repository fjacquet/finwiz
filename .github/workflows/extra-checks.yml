name: Extra checks
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
concurrency:
  group: extra-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: fjacquet/ci/actions/setup-uv@v1.2.0 # nosemgrep: github-actions.security.third-party-action-not-pinned-to-commit-sha
        with: { python-version: "3.13" }
      - run: uv sync --all-extras --all-groups
      - run: uvx vulture src/finwiz --min-confidence 80
      - run: uvx pylint --disable=all --enable=duplicate-code --min-similarity-lines=37 --score=no src/finwiz
      - run: make check-unittest-mock
      - run: make check-file-size
