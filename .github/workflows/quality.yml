name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Test & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Dead code check (vulture)
        run: uvx vulture src/finwiz --min-confidence 80

      - name: Duplicate code check (pylint, 37-line clean baseline)
        run: uvx pylint --disable=all --enable=duplicate-code --min-similarity-lines=37 --score=no src/finwiz

      - name: Check for banned unittest.mock
        run: make check-unittest-mock

      - name: Check new file sizes (300 lines max)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # In CI, check files added in this PR compared to base branch
          if [ "$EVENT_NAME" = "pull_request" ]; then
            NEW_FILES=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- '*.py')
          else
            NEW_FILES=$(git diff --name-only --diff-filter=A HEAD~1...HEAD -- '*.py' 2>/dev/null || true)
          fi
          if [ -n "$NEW_FILES" ]; then
            echo "$NEW_FILES" | xargs uv run python scripts/check_new_file_size.py --check-all
          else
            echo "No new Python files to check"
          fi

      - name: Run tests (with coverage gate, parallel)
        run: make coverage-check
