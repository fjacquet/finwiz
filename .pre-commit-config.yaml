# Pre-commit hooks for FinWiz
# Install with: pre-commit install

repos:
  # Code formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Documentation checks
  - repo: local
    hooks:
      - id: docs-validation
        name: Documentation Validation
        entry: uv run python scripts/validate_docs.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

      - id: mkdocs-build-check
        name: MkDocs Build Check
        entry: uv run mkdocs build --strict --clean
        language: system
        files: ^(docs/.*\.md|mkdocs\.yml)$
        pass_filenames: false

  # unittest.mock enforcement (only in test files, not documentation)
  - repo: local
    hooks:
      - id: check-unittest-mock
        name: Check for banned unittest.mock
        entry: >-
          bash -c 'if grep -E "^[[:space:]]*(from unittest\.mock|import unittest\.mock)"
          tests/ -r 2>/dev/null; then echo "unittest.mock found in tests/";
          echo "Use pytest-mock instead."; exit 1; fi'
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false

      - id: check-new-file-size
        name: Check new file size (300 lines max)
        entry: uv run python scripts/check_new_file_size.py
        language: system
        files: \.py$
        pass_filenames: true

  # Python type checking (local hook to use project's virtual environment)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/finwiz --config-file=pyproject.toml
        language: system
        files: ^src/finwiz/.*\.py$
        pass_filenames: false

  # Dead-code detection. Mirrors the `extra` CI job so an unused import fails
  # here (~1s) instead of after a push. The flags must stay identical to
  # .github/workflows/extra-checks.yml — a hook that disagrees with CI is worse
  # than no hook, because it teaches you to trust a green commit that CI rejects.
  #
  # `pylint --enable=duplicate-code` from that same job is deliberately NOT
  # mirrored: it takes ~24s against vulture's ~1s, and a hook that slow gets
  # bypassed with --no-verify, which disables every hook above it too.
  - repo: local
    hooks:
      - id: vulture
        name: Dead code (vulture, matches CI)
        entry: uvx vulture src/finwiz --min-confidence 80
        language: system
        files: ^src/finwiz/.*\.py$
        pass_filenames: false
