# Documentation Deployment Configuration
# This file defines deployment environments and their settings

environments:
  production:
    name: "Production"
    branch: "gh-pages"
    url_pattern: "https://{owner}.github.io/{repo}/"
    description: "Main production documentation site"
    auto_deploy: true
    validation:
      strict: true
      fail_on_warnings: false
    optimization:
      minify_assets: true
      compress_files: true
      optimize_images: true
    
  staging:
    name: "Staging"
    branch: "gh-pages-staging"
    url_pattern: "https://{owner}.github.io/{repo}/staging/"
    description: "Staging environment for preview deployments"
    auto_deploy: false
    validation:
      strict: false
      fail_on_warnings: false
    optimization:
      minify_assets: false
      compress_files: false
      optimize_images: false

# Deployment settings
deployment:
  # GitHub Pages settings
  github_pages:
    enabled: true
    custom_domain: null  # Set to your custom domain if using one
    enforce_https: true
    
  # Build settings
  build:
    clean_before_build: true
    strict_mode: true
    include_drafts: false
    
  # Validation settings
  validation:
    check_links: true
    check_images: true
    check_accessibility: true
    max_file_size_mb: 10
    
  # Performance settings
  performance:
    compress_assets: true
    minify_css: true
    minify_js: true
    optimize_images: true
    
# Rollback settings
rollback:
  enabled: true
  max_rollback_commits: 5
  backup_before_deploy: true
  
# Notification settings (for future use)
notifications:
  slack:
    enabled: false
    webhook_url: null
    
  email:
    enabled: false
    recipients: []
    
# Monitoring settings (for future use)
monitoring:
  uptime_checks: false
  performance_monitoring: false
  error_tracking: false