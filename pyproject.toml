[project]
name = "finwiz"
version = "0.1.0"
description = "finwiz using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai-tools>=0.46.0",
    "crewai[tools]>=0.120.1,<1.0.0",
    "firecrawl-py>=2.7.1",
    "langchain-core>=0.3.65",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "ruff>=0.11.13",
    "serpapi>=0.1.5",
    "yfinance>=0.2.62",
    "tavily-python>=0.7.5",
    "weasyprint>=65.1",
    "dotenv>=0.9.9",
    "pydantic>=2.11.7",
    "unstructured>=0.18.11",
    "ta-lib>=0.6.6",
    "backtrader>=1.9.78.123",
    "quantlib>=1.39",
    "pyportfolioopt>=1.5.5",
    "plotly>=6.3.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.29",
    "rumdl>=0.0.146",
    "perplexityai>=0.12.0",
]

[project.scripts]
kickoff = "finwiz.main:kickoff"
run_crew = "finwiz.main:kickoff"
plot = "finwiz.main:plot"

[project.optional-dependencies]
dev = [
  "ruff>=0.4.8,<1.0.0",
  "pytest>=8.4.1",
  "pytest-mock>=3.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 132
indent-width = 4

# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes and pycodestyle rules by default.
# Flake8-compatible list of codes to enable/disable.
select = ["E", "F", "W", "I", "UP", "ANN", "D"]
ignore = ["ANN101", "ANN102", "ANN401", "D203", "D212", "W291"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D100", "D101", "D102", "D103"]
"src/finwiz/schemas/**/*.py" = ["D100", "D101", "D102", "D103", "D401"]
"src/finwiz/crews/**/*.py" = ["D102"]
"src/finwiz/tools/etf_crew.py" = ["D102"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, format code snippets in docstrings.
docstring-code-format = true
# Line endings: "auto" | "lf" | "crlf"
line-ending = "auto"

[tool.pytest.ini_options]

testpaths = ["tests"]
addopts = [
    "--cov=src/finwiz",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=65",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "-m", "not integration"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "integration: marks tests as integration tests (deselected by default)",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running",
    "asyncio: marks tests as async tests",
    "performance: marks tests as performance tests",
    "benchmark: marks tests as benchmark tests",
    "core_analysis: marks tests as core analysis related",
    "crew: marks tests as crew-specific tests",
    "flow: marks tests as flow orchestration tests",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pypdf.*",
    "docx.*",
    "litellm.*",
    "pandas.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]


dependency-groups.dev = [
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "safety>=3.2.4",
]
package=true

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest-mock>=3.14.1",
    "pytest-timeout>=2.4.0",
    "types-pyyaml>=6.0.12.20250822",
    "faker>=33.1.0",
    "pytest-cov>=7.0.0",
]

[tool.markdownlint]
# MD003: Heading style (Set to enforce '# Heading 1' style)
MD003 = { style = "atx" }
# MD004: Unordered list style (Set to enforce consistency, e.g., 'dash' for -)
MD004 = { style = "dash" }
# MD007: Unordered list indentation (2 spaces is common)
MD007 = { indent = 2 }
# MD013: Line length (Set 80 characters, but ignore code blocks and tables)
MD013 = { line_length = 120, code_blocks = false, tables = false }
# MD026: Trailing punctuation in heading (Enforce no punctuation)
MD026 = { punctuation = ".,;:!?" }
# MD029: Ordered list item prefix (Set to 'one' to enforce '1.', '2.', '3.')
MD029 = { style = "one" }
# MD035: Horizontal rule style (Enforce '---')
MD035 = { style = "---" }
# MD046: Code block style (Enforce 'fenced' code blocks)
MD046 = { style = "fenced" }
# MD049: Emphasis style (Set to "consistent" to enforce the style chosen for MD036)
MD049 = { style = "consistent" }

# Rules that are simply enabled (true) or disabled (false):
# By default, all rules are enabled unless explicitly disabled or configured.
# You can override this by explicitly enabling/disabling individual rules:
MD001 = true  # Heading levels should only increment by one
MD005 = true  # Inconsistent indentation for list items
MD009 = false  # Trailing spaces
MD010 = true  # Hard tabs
MD012 = true  # Multiple consecutive blank lines
MD014 = true  # Dollar signs in shell examples
MD018 = true  # No space after hash on atx style heading
MD019 = true  # Multiple spaces after hash on atx style heading
MD022 = true  # Headings should be surrounded by blank lines (Keep this to fix your error)
MD024 = true  # Multiple headings with the same content
MD025 = true  # Multiple top-level headings
MD027 = true  # Multiple spaces after blockquote marker
MD030 = true  # Spaces after list markers
MD031 = true  # Fenced code blocks should be surrounded by blank lines
MD032 = true  # Lists should be surrounded by blank lines (Keep this to fix your error)
MD033 = false # Inline HTML (Set to false if you want to allow it)
MD034 = true  # Bare URLs should be enclosed in angle brackets
MD038 = true  # Spaces inside code span elements
MD039 = true  # Spaces inside link text
MD040 = true  # Fenced code blocks should have a language specified
MD041 = false # First line in file should be a top-level heading (Disabled as it's often too strict)
MD042 = true  # No empty links
MD047 = true  # Files should end with a single newline character (Keep this to fix your error)
MD051 = true  # Link reference definitions should be used
MD052 = true  # Reference links and images should be used
