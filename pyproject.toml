[project]
name = "finwiz"
version = "0.1.0"
description = "finwiz using crewAI"
authors = [{ name = "Your Name", email = "fred.jacquet@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "firecrawl-py>=2.7.1",
    "langchain-core>=0.3.65",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "ruff>=0.11.13",
    "serpapi>=0.1.5",
    "yfinance>=0.2.62",
    "tavily-python>=0.7.5",
    "weasyprint>=65.1",
    "dotenv>=0.9.9",
    "pydantic>=2.11.7",
    "unstructured>=0.18.11",
    "ta-lib>=0.6.6",
    "backtrader>=1.9.78.123",
    "quantlib>=1.39",
    "pyportfolioopt>=1.5.5",
    "plotly>=6.3.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.29",
    "langchain-text-splitters>=0.3.0",
    "rumdl>=0.0.146",
    "perplexityai>=0.12.0",
    "trio>=0.31.0",
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    "pandas>=2.3.2",
    "statsmodels>=0.14.5",
    "quandl>=3.7.0",
    "bs4>=0.0.2",
    "pytest-asyncio>=0.24.0",
    "beautifulsoup4>=4.14.2",
    "faiss-cpu>=1.9.0",
    "sec-edgar-downloader>=5.0.0",
    "mkdocs-material>=9.6.22",
    "mkdocs>=1.6.1",
    "sec-api>=1.0.32",
    "supabase>=2.22.4",
    "asyncpg>=0.30.0",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "nest-asyncio>=1.6.0",
    "empyrical-reloaded>=0.5.12",
    "crewai[tools]>=1.5.0",
    "qdrant-client>=1.16.0",
]

[project.scripts]
kickoff = "finwiz.main:kickoff"
run_crew = "finwiz.main:kickoff"
plot = "finwiz.main:plot"

[project.optional-dependencies]
dev = [
  "ruff>=0.4.8,<1.0.0",
  "pytest>=8.4.1",
  "pytest-mock>=3.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 180
indent-width = 4

# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes and pycodestyle rules by default.
# Flake8-compatible list of codes to enable/disable.
select = ["E", "F", "W", "I", "UP", "ANN", "D", "TID"]
ignore = [ "ANN401", "D203", "D212", "F841", "W291"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Ban unittest.mock - use pytest-mock instead
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Use pytest-mock instead. Import 'mocker' fixture in test functions."
"unittest.mock.Mock".msg = "Use pytest-mock instead. Use 'mocker.Mock()' from the mocker fixture."
"unittest.mock.MagicMock".msg = "Use pytest-mock instead. Use 'mocker.MagicMock()' from the mocker fixture."
"unittest.mock.AsyncMock".msg = "Use pytest-mock instead. Use 'mocker.AsyncMock()' from the mocker fixture."
"unittest.mock.patch".msg = "Use pytest-mock instead. Use 'mocker.patch()' from the mocker fixture."
"unittest.mock.patch.object".msg = "Use pytest-mock instead. Use 'mocker.patch.object()' from the mocker fixture."

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [ "ANN","D100", "D101", "D102", "D103"]
"src/finwiz/schemas/**/*.py" = ["D100", "D101", "D102", "D103", "D401", "UP045"]
"src/finwiz/crews/**/*.py" = ["D102"]
"src/finwiz/tools/etf_crew.py" = ["D102"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, format code snippets in docstrings.
docstring-code-format = true
# Line endings: "auto" | "lf" | "crlf"
line-ending = "auto"

[tool.pytest.ini_options]

testpaths = ["tests"]
addopts = [
    "--cov=src/finwiz",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=65",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "-m", "not integration"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "integration: marks tests as integration tests (deselected by default)",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running",
    "asyncio: marks tests as async tests",
    "performance: marks tests as performance tests",
    "benchmark: marks tests as benchmark tests",
    "core_analysis: marks tests as core analysis related",
    "crew: marks tests as crew-specific tests",
    "flow: marks tests as flow orchestration tests",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
# Python version
python_version = "3.12"

# Strictness flags (gradually enable these)
disallow_untyped_defs = false  # Enable per-module for gradual adoption
disallow_incomplete_defs = false  # Enable per-module for gradual adoption
check_untyped_defs = true
disallow_untyped_decorators = false  # Too strict for current codebase
no_implicit_optional = true

# Warning flags
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Output configuration
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true
error_summary = true

# Import discovery
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

# Caching
cache_dir = ".mypy_cache"
sqlite_cache = true
incremental = true

# Exclude patterns
exclude = [
    "^build/",
    "^dist/",
    "^.venv/",
    "^venv/",
    "^tests/fixtures/",
    "^.mypy_cache/",
]

# Phase 1: Core utilities with strict checking
[[tool.mypy.overrides]]
module = "finwiz.utils.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Phase 2: Schemas (Pydantic models already have good type hints)
[[tool.mypy.overrides]]
module = "finwiz.schemas.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Tests: Relaxed checking
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
allow_untyped_defs = true

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "docx.*",
    "litellm.*",
    "pandas.*",
    "numpy.*",
    "QuantLib.*",
    "crewai.*",
    "crewai_tools.*",
    "dotenv.*",
    "backtrader.*",
    "yfinance.*",
    "empyrical.*",
    "talib.*",
    "pyportfolioopt.*",
]
ignore_missing_imports = true


[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]


dependency-groups.dev = [
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "safety>=3.2.4",
]
package=true

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest-mock>=3.14.1",
    "pytest-timeout>=2.4.0",
    "types-pyyaml>=6.0.12.20250822",
    "faker>=33.1.0",
    "pytest-cov>=7.0.0",
    "types-requests>=2.32.4.20250913",
    "types-psutil>=7.0.0.20251001",
    "pandas-stubs>=2.3.2.250926",
    "scipy-stubs>=1.16.2.0",
    "hypothesis>=6.148.1",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocs-awesome-pages-plugin>=2.9.3",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "pymdown-extensions>=10.12",
    "pre-commit>=4.0.1",
]
