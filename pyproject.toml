[project]
name = "finwiz"
version = "0.1.0"
description = "finwiz using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai-tools>=0.46.0",
    "crewai[tools]>=0.120.1,<1.0.0",
    "firecrawl-py>=2.7.1",
    "langchain-core>=0.3.65",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "ruff>=0.11.13",
    "serpapi>=0.1.5",
    "yfinance>=0.2.62",
    "tavily-python>=0.7.5",
    "weasyprint>=65.1",
    "dotenv>=0.9.9",
    "pydantic>=2.11.7",
    "unstructured>=0.18.11",
]

[project.scripts]
kickoff = "finwiz.main:kickoff"
run_crew = "finwiz.main:kickoff"
plot = "finwiz.main:plot"

[project.optional-dependencies]
dev = [
  "ruff>=0.4.8,<1.0.0",
  "pytest>=8.4.1",
  "pytest-mock>=3.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 132
indent-width = 4

# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes and pycodestyle rules by default.
# Flake8-compatible list of codes to enable/disable.
select = ["E", "F", "W", "I", "UP", "ANN", "D"]
ignore = ["ANN101", "ANN102", "ANN401", "D203", "D212", "W291"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D100", "D101", "D102", "D103"]
"src/finwiz/schemas/**/*.py" = ["D100", "D101", "D102", "D103", "D401"]
"src/finwiz/crews/**/*.py" = ["D102"]
"src/finwiz/tools/etf_crew.py" = ["D102"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, format code snippets in docstrings.
docstring-code-format = true
# Line endings: "auto" | "lf" | "crlf"
line-ending = "auto"

[tool.pytest.ini_options]

testpaths = ["tests"]
addopts = [
    "--cov=src/finwiz",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=65",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "-m", "not integration"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "integration: marks tests as integration tests (deselected by default)",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pypdf.*",
    "docx.*",
    "litellm.*",
    "pandas.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.uv]
dev-dependencies = [
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "safety>=3.2.4",
]
package=true

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest-mock>=3.14.1",
    "pytest-timeout>=2.4.0",
    "types-pyyaml>=6.0.12.20250822",
    "faker>=33.1.0",
]
