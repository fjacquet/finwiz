[project]
name = "finwiz"
version = "5.5.1"
description = "finwiz using crewAI"
authors = [{ name = "Frederic Jacquet", email = "fred.jacquet@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=1.3.3",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "yfinance>=0.2.62",
    "pydantic>=2.13.3",
    "ta-lib>=0.6.8",
    "backtrader>=1.9.78.123",
    "quantlib>=1.42.1",
    "pyportfolioopt>=1.5.5",
    "plotly>=6.8.0",
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    "pandas>=2.3.2",
    "beautifulsoup4>=4.14.3",
    "nest-asyncio>=1.6.0",
    "empyrical-reloaded>=0.5.12",
    "crewai>=1.5.0",
    "litellm>=1.83.10",
    "aiolimiter>=1.2.1",
    "finnhub-python>=2.4.20",
    "fredapi>=0.5.2",
    "vaderSentiment>=3.3.2",
    "feedparser>=6.0.12",
    "gnews>=0.3.7",
    "fear-and-greed>=0.0.9",
    "requests>=2.33.1",
    "aiohttp>=3.14.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psutil>=7.2.2",
    "python-dateutil>=2.9.0.post0",
    "tenacity>=9.1.4",
    "openai>=2.33.0",
    "pydantic-settings>=2.14.0",
]

[project.scripts]
kickoff = "finwiz.main:kickoff"
run_crew = "finwiz.main:kickoff"
plot = "finwiz.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.deptry.per_rule_ignores]
# Imported directly but intentionally not declared as top-level dependencies:
#   httpcore      -> transitive of httpx; not a direct top-level need
#   pydantic_core -> ships version-locked with pydantic; pinning separately risks conflict
DEP003 = ["httpcore", "pydantic_core"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 180
indent-width = 4

# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes and pycodestyle rules by default.
# Flake8-compatible list of codes to enable/disable.
select = ["E", "F", "W", "I", "UP", "TID", "D", "S", "B", "RUF"]
ignore = [
    "E501",   # Line too long (handled by line-length=180)
    "F841",   # Local variable assigned but never used
    "W291",   # Trailing whitespace
    "D100",   # Missing docstring in public module
    "D102",   # Missing docstring in public method (too many existing violations)
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D212",   # Multi-line summary at first line (conflicts with D213; codebase uses second-line style)
    "D213",   # Multi-line summary at second line (conflicts with D212)
    "D301",   # Escape sequence in docstring (edge cases with raw strings)
    "D417",   # Missing argument description in docstring (partial docstrings common)
    "S101",   # Use of assert (common in non-test code for invariants)
    "S110",   # try-except-pass (intentional silencing in some cases)
    "S301",   # Suspicious pickle usage (used for caching)
    "S311",   # Standard pseudo-random generators (not used for security)
    "B904",   # raise-without-from-inside-except (needs gradual adoption)
    "RUF001", # Ambiguous unicode in string (emoji in logging is intentional)
    "RUF002", # Ambiguous unicode in docstring (emoji in docstrings)
    "RUF012", # Mutable class default (common in Pydantic/dataclass patterns)
    "RUF005", # Collection literal concatenation (style preference)
    "RUF015", # Unnecessary iterable allocation for first element
    "RUF022", # Unsorted __all__ (cosmetic, not worth fixing now)
    "RUF034", # Useless if-else (style preference in existing code)
    "RUF059", # Unused unpacked variable (common in tuple unpacking)
    "B007",   # Unused loop control variable (common _ pattern needed)
    "B023",   # Function uses loop variable (needs careful refactoring)
    "B028",   # No explicit stacklevel in warnings.warn
    "B905",   # zip-without-explicit-strict (Python 3.10+ pattern)
    "S104",   # Hardcoded bind all interfaces (dev server)
    "S324",   # Hashlib insecure hash (used for non-security checksums)
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Ban unittest.mock - use pytest-mock instead
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Use pytest-mock instead. Import 'mocker' fixture in test functions."
"unittest.mock.Mock".msg = "Use pytest-mock instead. Use 'mocker.Mock()' from the mocker fixture."
"unittest.mock.MagicMock".msg = "Use pytest-mock instead. Use 'mocker.MagicMock()' from the mocker fixture."
"unittest.mock.AsyncMock".msg = "Use pytest-mock instead. Use 'mocker.AsyncMock()' from the mocker fixture."
"unittest.mock.patch".msg = "Use pytest-mock instead. Use 'mocker.patch()' from the mocker fixture."
"unittest.mock.patch.object".msg = "Use pytest-mock instead. Use 'mocker.patch.object()' from the mocker fixture."

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "S", "B017", "RUF013", "RUF043"]
"src/finwiz/schemas/**/*.py" = ["D100", "D101", "D102", "D103", "D401", "UP045"]
"src/finwiz/crews/**/*.py" = ["D102"]
"src/finwiz/tools/etf_crew.py" = ["D102"]
"scripts/**/*.py" = ["ANN", "D", "S", "B", "RUF"]
"tests/property/*.py" = ["D400", "D415"]
"src/finwiz/crews/deep_analysis/deep_analysis.py" = ["D401"]
"src/finwiz/reporting/css/*.py" = ["D"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, format code snippets in docstrings.
docstring-code-format = true
# Line endings: "auto" | "lf" | "crlf"
line-ending = "auto"

[tool.pytest.ini_options]

testpaths = ["tests"]
# NOTE: coverage is intentionally NOT in addopts — it adds a ~7-11x slowdown to
# every run. The fast default (`make test`) runs without it; coverage + the 65%
# gate run via `make coverage` / `make coverage-check` (used in CI).
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "-m", "not integration"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "integration: marks tests as integration tests (deselected by default)",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running",
    "asyncio: marks tests as async tests",
    "performance: marks tests as performance tests",
    "benchmark: marks tests as benchmark tests",
    "core_analysis: marks tests as core analysis related",
    "crew: marks tests as crew-specific tests",
    "flow: marks tests as flow orchestration tests",
    "regression: regression test guarding against a previously-shipped bug",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
# Python version
python_version = "3.12"

# Strictness flags (gradually enable these)
disallow_untyped_defs = false  # Enable per-module for gradual adoption
disallow_incomplete_defs = false  # Enable per-module for gradual adoption
check_untyped_defs = true
disallow_untyped_decorators = false  # Too strict for current codebase
no_implicit_optional = true
disable_error_code = [
    "import-untyped",  # Many third-party libs lack stubs
    "call-arg",        # Too noisy with third-party libs (320 errors)
    "attr-defined",    # False positives with dict access (199 errors)
    "union-attr",      # False positives with Optional types (77 errors)
    "operator",        # Numpy/pandas type noise (69 errors)
    "index",           # Dict/list indexing noise (51 errors)
    "var-annotated",   # Missing annotations - gradual adoption (52 errors)
    "unreachable",     # False positives from except blocks (44 errors)
]  # Keep: arg-type, return-value, assignment, misc (catch real bugs)

# Warning flags
warn_return_any = false  # Disabled: too noisy with untyped third-party libs
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false  # Disabled: conflicts with relaxed settings
warn_no_return = true
warn_unreachable = true
strict_equality = false  # Disabled: too strict for mixed-type comparisons

# Output configuration
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true
error_summary = true

# Import discovery
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

# Caching
cache_dir = ".mypy_cache"
sqlite_cache = true
incremental = true

# Exclude patterns
exclude = [
    "^build/",
    "^dist/",
    "^.venv/",
    "^venv/",
    "^tests/fixtures/",
    "^.mypy_cache/",
]

# Phase 1: Core utilities with strict checking
[[tool.mypy.overrides]]
module = "finwiz.utils.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Phase 2: Schemas (Pydantic models already have good type hints)
[[tool.mypy.overrides]]
module = "finwiz.schemas.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Tests: Relaxed checking
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
allow_untyped_defs = true

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "docx.*",
    "litellm.*",
    "pandas.*",
    "numpy.*",
    "scipy.*",
    "bs4.*",
    "QuantLib.*",
    "crewai.*",
    "crewai_tools.*",
    "dotenv.*",
    "backtrader.*",
    "yfinance.*",
    "empyrical.*",
    "talib.*",
    "pyportfolioopt.*",
    "langchain.*",
    "langchain_core.*",
    "pydantic_settings.*",
    "supabase.*",
    "jinja2.*",
    "httpx.*",
    "aiohttp.*",
    "nest_asyncio.*",
    "playwright.*",
    "serpapi.*",
    "alpha_vantage.*",
    "fredapi.*",
    "finnhub.*",
    "vaderSentiment.*",
    "feedparser.*",
    "gnews.*",
    "fear_and_greed.*",
    "asyncpg.*",
    "dateutil.*",
    "plotly.*",
    "pypfopt.*",
]
ignore_missing_imports = true


[tool.coverage.run]
# FinWiz AI Minimalism rule: coverage measures *deterministic* Python only.
# LLM-backed code paths (crew agents, prompt composition, qualitative
# synthesis glue, Perplexity wrappers) depend on model sampling and must
# NOT be driven by line coverage — the right guards there are schema
# contract tests, crew-contract-reviewer, and evals. See
# `feedback_no_coverage_on_ai.md` for the full rationale.
omit = [
    # Entire crew tree — agents, tasks, crew wiring, prompt config.
    "src/finwiz/crews/*",
    "src/finwiz/crews/**/*",
    # Crew factory is pure LLM instantiation + fallback wiring.
    "src/finwiz/crew_factory.py",
    # LLM configuration (model choice, temperature, API keys).
    "src/finwiz/config/llm/*",
    "src/finwiz/config/llm/**/*",
    # Perplexity LLM-backed search / analysis wrappers.
    "src/finwiz/tools/perplexity_search_tool.py",
    "src/finwiz/tools/perplexity_analysis_integration.py",
    "src/finwiz/tools/perplexity_errors.py",
    "src/finwiz/tools/perplexity_feature_utils.py",
    "src/finwiz/tools/perplexity_logging.py",
    "src/finwiz/tools/perplexity_performance.py",
    "src/finwiz/tools/perplexity_performance_benchmark.py",
    # LLM retry / litellm telemetry — both LLM-specific, not deterministic.
    "src/finwiz/tools/llm_retry.py",
    "src/finwiz/infrastructure/monitoring/litellm_callback.py",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]


package=true

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "bandit>=1.8.6",
    "safety>=3.2.4",
    "cyclonedx-bom>=4.0.0",
    "pip-audit>=2.9.0",
    "pytest-asyncio>=1.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "types-pyyaml>=6.0.12.20250822",
    "faker>=33.1.0",
    "pytest-cov>=7.0.0",
    "types-requests>=2.33.0.20260518",
    "types-psutil>=7.0.0.20251001",
    "pandas-stubs>=3.0.0.260204",
    "scipy-stubs>=1.17.1.4",
    "hypothesis>=6.148.1",
    "pre-commit>=4.5.1",
    "ruff>=0.4.8,<1.0.0",
    "pytest>=8.4.1",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "pymdown-extensions>=10.21.3",
    "pre-commit>=4.0.1",
]

[tool.uv]
# Security floors for transitive dependencies (Dependabot). These packages are
# pulled in indirectly (mostly via crewai/langchain); constraint-dependencies
# raise their minimum resolved version without adding them as direct deps.
# NOTE: chromadb (GHSA-f4j7-r4q5-qw2c, pre-auth code injection in its server)
# has NO patched release yet (latest is the vulnerable 1.5.9) and FinWiz never
# runs a Chroma server, so it is intentionally not pinned here.
constraint-dependencies = [
    "gitpython>=3.1.50",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "uv>=0.11.15",
    "pyjwt>=2.13.0",
]
