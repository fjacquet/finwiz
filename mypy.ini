# DEPRECATED: This file is kept for backwards compatibility only.
# Mypy configuration has been moved to pyproject.toml [tool.mypy] section.
# Please use pyproject.toml for all mypy configuration.
#
# To use the new configuration, run:
#   mypy --config-file=pyproject.toml src/finwiz
#
# Or simply:
#   mypy src/finwiz
#
# Mypy will automatically detect and use pyproject.toml if present.

[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = False
strict_optional = True
strict_equality = False
disable_error_code = import-untyped, call-arg, attr-defined, union-attr, operator, index, var-annotated
mypy_path = src
explicit_package_bases = True
namespace_packages = True

[mypy-crewai.*]
ignore_missing_imports = True

[mypy-crewai_tools.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-QuantLib.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-intrinio_sdk.*]
ignore_missing_imports = True
